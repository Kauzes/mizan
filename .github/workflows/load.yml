name: Load profiles

# Its own workflow, like the rollout test. The steady and spike profiles take about seven minutes
# on top of starting the platform, which is too long to put in front of every pull request and
# exactly right for main and for anything that changes how load is generated. The thirty minute
# soak runs only when asked for.
#
# The numbers from a GitHub runner are not the numbers in docs/performance: a different machine,
# shared with other jobs. What this protects is the thresholds. A change that makes the platform
# miss them fails here.
#
# At a rate this machine can sustain. The first run offered steady's recorded 30 payments a second
# and the runner saturated: 24.8 a second captured, 755 payments never started, p50 1.7 seconds per
# step, with every service, Postgres, Kafka and Redis on its few cores. That failed the latency
# thresholds, and it would fail them on every run, which measures the runner and protects nothing.
# At 10 a second the same thresholds are a regression check again. Spike is unchanged: it is meant
# to overload whatever it runs on, and its thresholds are correctness only.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profiles:
        description: "Profiles to run, space separated (steady, spike, soak)"
        default: "steady spike"
  pull_request:
    paths:
      - "deploy/load/**"
      - "scripts/load-profiles.sh"
      - ".github/workflows/load.yml"

concurrency:
  group: load-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load:
    name: Stays inside its thresholds under load
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Start the platform
        env:
          MIZAN_LOG_FORMAT: ecs
        run: docker compose up -d --build --wait

      - name: Take payments under each profile
        env:
          MIZAN_LOAD_RATE: "10"
        run: ./scripts/load-profiles.sh ${{ github.event.inputs.profiles || 'steady spike' }}

      - name: What was measured
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-results
          path: build/load
          retention-days: 30
          if-no-files-found: ignore

      - name: What the platform said while it was measured
        if: failure()
        run: docker compose logs --tail 200 gateway payment-service ledger-service
