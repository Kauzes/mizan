name: CI

on:
  push:
    branches: [main]
  # No branch filter. A pull request targeting anything other than main, which is what a
  # stacked pull request is, otherwise runs no checks at all and shows nothing to say so.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/build/reports/tests/test"
          retention-days: 7
          if-no-files-found: ignore

  console:
    name: Console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Its own job rather than a step in the Gradle build. Nothing in the console is a Gradle
    # module, the two toolchains share nothing, and a broken component test should say so
    # while the services are still being compiled rather than after.

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install
        working-directory: console
        # ci, not install: it builds from the lock file and fails if package.json and the
        # lock file disagree, which is the failure that otherwise reaches production.
        run: npm ci

      - name: Types and build
        working-directory: console
        run: npm run build

      - name: Test
        working-directory: console
        run: npm test

  smoke:
    name: Smoke and browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deliberately not needing the build job. This checks something the test suite
    # structurally cannot: services as real processes, in the images they are deployed as,
    # reached through the gateway. Three defects in this platform's history were visible only
    # from here, including one where the whole suite stayed green while the service would not
    # start at all. Making it wait on the suite would only make it slower to say so.

    steps:
      - uses: actions/checkout@v7

      - name: Start the platform
        # The same command a reader is told to run. If this needs a flag the README does not
        # mention, the README is wrong and this is where that shows up.
        run: docker compose up -d --build --wait

      - name: Smoke check
        run: ./scripts/smoke.sh

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install the console's tooling
        working-directory: console
        run: npm ci

      - name: Install a browser
        working-directory: console
        run: npx playwright install --with-deps chromium

      - name: Browser journey
        # In this job rather than its own, because it needs exactly what this job already
        # has: the platform running as real processes, in the images it is deployed as, with
        # the console served beside the API on one origin.
        working-directory: console
        run: npm run e2e

      - name: What the browser saw
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-journey
          path: |
            console/playwright-report
            console/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Seed demo data
        # Not an assertion, but it exercises paths the smoke check does not — a payment left
        # as an intent, one the acquirer never answers about — and a seed script that has
        # quietly stopped working is a bad thing to discover while demonstrating.
        run: ./scripts/seed.sh

      - name: The whole ledger balances
        # Again, and this time over everything this job produced: the smoke check's payments,
        # refunds, settlements and payouts, the browser journey's, and the demo seed's. Three
        # writers, none of which wrote anything in order to make this pass, and one check that
        # reads the tables and asks what has to be true of any ledger whatever wrote it.
        run: ./scripts/books-balance.sh

      - name: What the services said
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the platform
        if: always()
        run: docker compose down -v
