openapi: 3.1.0
info:
  description: |-
    Part of the Mizan payments platform. Every service is reached through the gateway under /api/v1.

    Errors are RFC 9457 problem details. The code field is the contract: it comes from a closed set, never changes meaning, and the HTTP status is derived from it. Branch on the code rather than on the status or the message. The responses under components.responses are named after those codes.

    Every request carries a correlation id. Send one in X-Correlation-Id and it is echoed back and printed on every log line the request touches; send none and one is generated at the edge. Quote it when reporting a problem.
  title: risk-service
  version: 0.1.0
servers:
- description: The local gateway. Services are not addressed directly.
  url: http://localhost:8080
tags:
- description: "What this platform thinks of a payment, and why"
  name: Risk
paths:
  /api/v1/risk/rulings:
    post:
      description: |-
        Records the ruling and, if the last few went the same way, moves this merchant's line.

        The movement is deliberately slow and bounded. It takes several consecutive rulings the same way before anything moves at all, it moves a few points when it does, and it can never drift more than twenty from where a person set it. A loop nobody bounded is a loop an attacker teaches, one released payment at a time.

        What a person set and what the loop inferred are kept separately, so the drift is always visible and always reversible.
      operationId: rule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulingRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: "The ruling, and what it moved"
        "400":
          $ref: "#/components/responses/VALIDATION_FAILED"
        "409":
          $ref: "#/components/responses/CONFLICT"
      summary: Record what an analyst decided
      tags:
      - Risk
  /api/v1/risk/rulings/merchants/{merchantId}:
    get:
      description: "Most recent first, with what the scorer had said at the time."
      operationId: forMerchant
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: The rulings
      summary: What has been ruled for a merchant
      tags:
      - Risk
  /api/v1/risk/scores:
    post:
      description: |-
        Returns approve, review or block, with everything that fired and what each was worth. The reasons are the point: a score with no reasons is a number nobody can argue with, and a decision nobody can argue with is one nobody can fix.

        Scoring is a pure function of the request. The same request scores the same way twice, including the timestamp, which is an input rather than a clock read inside.

        No card number is sent or accepted. The caller supplies a fingerprint, so that the same card is recognisable across payments without this service ever holding one.
      operationId: score
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreResponse"
          description: "What it decided, and why"
        "400":
          $ref: "#/components/responses/VALIDATION_FAILED"
      summary: Score a payment
      tags:
      - Risk
components:
  headers:
    X-Correlation-Id:
      description: "The correlation id this request was handled under. Echoed from\
        \ the request when it sent one, generated at the edge otherwise."
      schema:
        type: string
  responses:
    CONFLICT:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 409 conflict. The body carries code CONFLICT.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    CONTENDED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 409 contended. The body carries code CONTENDED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    FORBIDDEN:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 403 forbidden. The body carries code FORBIDDEN.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    IDEMPOTENCY_KEY_REUSED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 409 idempotency-key-reused. The body carries code IDEMPOTENCY_KEY_REUSED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    INTERNAL_ERROR:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 500 internal-error. The body carries code INTERNAL_ERROR.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    MALFORMED_REQUEST:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 400 malformed-request. The body carries code MALFORMED_REQUEST.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    METHOD_NOT_ALLOWED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 405 method-not-allowed. The body carries code METHOD_NOT_ALLOWED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    NOT_FOUND:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 404 not-found. The body carries code NOT_FOUND.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    RATE_LIMITED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 429 rate-limited. The body carries code RATE_LIMITED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UNAUTHORIZED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 401 unauthorized. The body carries code UNAUTHORIZED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UNPROCESSABLE:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 422 unprocessable. The body carries code UNPROCESSABLE.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UPSTREAM_TIMEOUT:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 504 upstream-timeout. The body carries code UPSTREAM_TIMEOUT.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UPSTREAM_UNAVAILABLE:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 503 upstream-unavailable. The body carries code UPSTREAM_UNAVAILABLE.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    VALIDATION_FAILED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 400 validation-failed. The body carries code VALIDATION_FAILED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
  schemas:
    FieldViolation:
      description: "One rejected field, in the shape a form can render beside the\
        \ input."
      properties:
        field:
          type: string
          description: The field that was rejected.
        message:
          type: string
          description: Why it was rejected.
      required:
      - field
      - message
    Problem:
      description: An RFC 9457 problem detail. The body of every failing request.
      example:
        code: VALIDATION_FAILED
        correlationId: 9f1c4e2a7b3d4f10
        detail: The request failed validation.
        errors:
        - field: amount.minorUnits
          message: must be greater than 0
        instance: /api/v1/payments
        status: 400
        timestamp: 2026-08-27T09:15:00Z
        title: validation-failed
        type: https://mizan.kauzes.dev/errors/validation-failed
      properties:
        code:
          type: string
          description: The stable machine readable error. Branch on this.
          enum:
          - VALIDATION_FAILED
          - MALFORMED_REQUEST
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - CONFLICT
          - IDEMPOTENCY_KEY_REUSED
          - CONTENDED
          - UNPROCESSABLE
          - RATE_LIMITED
          - INTERNAL_ERROR
          - UPSTREAM_UNAVAILABLE
          - UPSTREAM_TIMEOUT
        correlationId:
          type: string
          description: "The id this request was handled under, for finding it in the\
            \ logs."
        detail:
          type: string
          description: "What went wrong, when the error was raised deliberately. An\
            \ unexpected failure carries a fixed message and no internals."
        errors:
          type: array
          description: "Present only on a validation failure, one entry per field."
          items:
            $ref: "#/components/schemas/FieldViolation"
        instance:
          type: string
          format: uri
          description: The path of the request that failed.
        status:
          format: int32
          description: "The HTTP status, derived from the code."
        timestamp:
          type: string
          format: date-time
          description: When the error was produced.
        title:
          type: string
          description: The code in readable form.
        type:
          type: string
          format: uri
          description: Identifies the error. It is not required to resolve.
      required:
      - code
      - correlationId
      - status
      - timestamp
      - title
      - type
    RulingRequest:
      type: object
      description: What an analyst decided about a held payment
      properties:
        merchantId:
          type: string
          format: uuid
        paymentId:
          type: string
          format: uuid
        riskReasons:
          type: string
          description: And why it said it
          maxLength: 2000
          minLength: 0
        riskScore:
          type: integer
          format: int32
          description: What the scorer had said at the time
        ruledBy:
          type: string
          example: grace
          maxLength: 200
          minLength: 0
        ruling:
          type: string
          description: RELEASED or REFUSED
          example: RELEASED
          minLength: 1
          pattern: RELEASED|REFUSED
        why:
          type: string
          example: "known customer, they called to confirm"
          maxLength: 1000
          minLength: 0
      required:
      - merchantId
      - paymentId
      - ruledBy
      - ruling
      - why
    ScoreRequest:
      type: object
      description: A payment to score
      properties:
        amount:
          type: integer
          format: int64
          description: Minor units
          example: 125000
          minimum: 0
        at:
          type: string
          format: date-time
          description: "When this is being scored. An input rather than a clock read\
            \ inside, so that the same request scores the same way twice and a test\
            \ can place a payment in time without waiting."
        cardCountry:
          type: string
          description: Where the card was issued
          example: TR
          pattern: "[A-Z]{2}"
        cardFingerprint:
          type: string
          description: "A stable identifier for the card, not the card. A fingerprint\
            \ the caller computes, so that the same card is recognisable across payments\
            \ without this service ever holding a card number."
          example: card_9f2b1c
          maxLength: 100
          minLength: 0
        currency:
          type: string
          example: TRY
          minLength: 1
          pattern: "[A-Z]{3}"
        merchantId:
          type: string
          format: uuid
        paymentId:
          type: string
          format: uuid
          description: The payment being scored
      required:
      - at
      - cardFingerprint
      - currency
      - merchantId
      - paymentId
    ScoreResponse:
      type: object
      description: "What the scorer decided, and why"
      properties:
        at:
          type: string
          format: date-time
          description: When it was scored
        blockAbove:
          type: integer
          format: int32
        paymentId:
          type: string
          format: uuid
        reviewAbove:
          type: integer
          format: int32
          description: "Where this merchant's line between approve and review sits,\
            \ and between review and block"
        score:
          type: integer
          format: int32
          description: What it added up to. Higher is riskier.
          example: 55
        signals:
          type: array
          description: "Everything that fired, and what each was worth"
          items:
            $ref: "#/components/schemas/Signal"
        verdict:
          type: string
          description: "APPROVE, REVIEW or BLOCK"
          enum:
          - APPROVE
          - REVIEW
          - BLOCK
    Signal:
      type: object
      properties:
        because:
          type: string
        contribution:
          type: integer
          format: int32
        rule:
          type: string
          enum:
          - UNUSUAL_AMOUNT
          - RAPID_ATTEMPTS
          - RECENTLY_DECLINED
          - SUSPICIOUSLY_ROUND
          - UNFAMILIAR_COUNTRY
          - KNOWN_GOOD_CARD
  securitySchemes:
    merchantApiKey:
      description: "The merchant's API key, naming which key signed the request. Public,\
        \ and not a secret. Issued at POST /api/v1/merchants/{merchantId}/api-keys,\
        \ which returns the signing secret once. Paired with merchantSignature and\
        \ merchantTimestamp; a key on its own is not enough."
      in: header
      name: X-Mizan-Key
      type: apiKey
    merchantJwt:
      bearerFormat: JWT
      description: "A short lived access token issued by identity-service, sent as\
        \ an Authorization bearer header. Obtained from POST /api/v1/tokens and renewed\
        \ at /api/v1/tokens/refresh. The gateway verifies it and passes the established\
        \ identity on; a service never sees the token itself."
      scheme: bearer
      type: http
    merchantSignature:
      description: |-
        HMAC-SHA256 of the canonical request under the key's secret, in lowercase hex.

        The canonical request is four lines joined with a newline: the uppercase method, the path, the value of X-Mizan-Timestamp, and the SHA-256 of the body in lowercase hex, which for a request with no body is the digest of the empty string.

            POST
            /api/v1/payments
            1788100000
            e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855

        Method and path are covered so a captured signature cannot be aimed at another endpoint, the body so it cannot be replayed with different numbers in it, and the timestamp so it cannot be replayed at all.
      in: header
      name: X-Mizan-Signature
      type: apiKey
    merchantTimestamp:
      description: "Unix seconds at which the request was signed. A request whose\
        \ timestamp is further from the platform's clock than the accepted window,\
        \ five minutes by default, is refused whatever its signature says."
      in: header
      name: X-Mizan-Timestamp
      type: apiKey
