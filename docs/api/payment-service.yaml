openapi: 3.1.0
info:
  description: |-
    Part of the Mizan payments platform. Every service is reached through the gateway under /api/v1.

    Errors are RFC 9457 problem details. The code field is the contract: it comes from a closed set, never changes meaning, and the HTTP status is derived from it. Branch on the code rather than on the status or the message. The responses under components.responses are named after those codes.

    Every request carries a correlation id. Send one in X-Correlation-Id and it is echoed back and printed on every log line the request touches; send none and one is generated at the edge. Quote it when reporting a problem.
  title: payment-service
  version: 0.1.0
servers:
- description: The local gateway. Services are not addressed directly.
  url: http://localhost:8080
tags:
- description: "Taking money, from intent to captured"
  name: Payments
- description: "What this platform stopped, and who decided about it"
  name: Reviews
paths:
  /api/v1/merchants/{merchantId}/payments:
    get:
      description: |-
        Most recent first, a page at a time. Every filter is optional and they narrow together: asking for two statuses and an amount range means payments in either status *and* inside that range.

        Where in the answer this page sits comes back in headers rather than in the body, so the body is the same list of payments it has always been and a client written against the earlier contract is unaffected: `X-Total-Count`, `X-Page`, `X-Page-Size`, and a `Link` header carrying the next and previous pages when there are any.

        A page holds 50 by default and 200 at most, and paging runs 10,000 payments deep. Further in than that, narrow the search: an offset is read by counting past every row before it, so a page number is the wrong tool for finding one payment among a year of them.

        Requires the PAYMENT_READ permission, held by: OWNER, ADMIN, ANALYST, VIEWER. The caller must be acting for the merchant in the path.
      operationId: list
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - description: Any of the payment statuses. Repeat for more than one.
        in: query
        name: status
        required: false
        schema:
          type: array
          items:
            type: string
      - description: "APPROVE, REVIEW, BLOCK or UNAVAILABLE"
        in: query
        name: riskVerdict
        required: false
        schema:
          type: array
          items:
            type: string
      - description: What an amount range is denominated in. Without it a range compares
          minor units across currencies.
        in: query
        name: currency
        required: false
        schema:
          type: string
      - description: "Inclusive, in minor units"
        in: query
        name: minAmount
        required: false
        schema:
          type: integer
          format: int64
      - description: "Inclusive, in minor units"
        in: query
        name: maxAmount
        required: false
        schema:
          type: integer
          format: int64
      - description: "Inclusive, against when the payment was created"
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - description: "Exclusive, so a day does not overlap the next"
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      - description: "The merchant's own reference, matched exactly"
        in: query
        name: reference
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentResponse"
          description: The page of payments
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "422":
          $ref: "#/components/responses/UNPROCESSABLE"
      security:
      - merchantJwt: []
      summary: Search a merchant's payments
      tags:
      - Payments
    post:
      description: |-
        Records that a payment is about to be attempted. Nobody is contacted and no money moves: this is the thing an authorization is later attached to.

        The reference is the merchant's own name for the payment and is unique within the merchant, so a caller who never received this response can find the payment again rather than creating a second one.

        Requires the PAYMENT_WRITE permission, held by: OWNER, ADMIN. The caller must be acting for the merchant in the path.
      operationId: create
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - description: "Names this attempt, so that repeating it cannot repeat its effect.\
          \ Sending the same key again returns what the first call produced, with\
          \ the same status, so a retry after a lost response is safe. The same key\
          \ with a different body is refused. A key belongs to one merchant and one\
          \ operation."
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          maxLength: 200
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
          description: "The payment, in its first state"
        "400":
          $ref: "#/components/responses/VALIDATION_FAILED"
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "409":
          $ref: "#/components/responses/CONFLICT"
        "422":
          $ref: "#/components/responses/UNPROCESSABLE"
      security:
      - merchantJwt: []
      summary: Create a payment intent
      tags:
      - Payments
  /api/v1/merchants/{merchantId}/payments/{paymentId}:
    get:
      description: |-
        Includes every step it has taken, oldest first, and where it may go next.

        Requires the PAYMENT_READ permission, held by: OWNER, ADMIN, ANALYST, VIEWER. The caller must be acting for the merchant in the path.
      operationId: find
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: paymentId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
          description: The payment
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
      security:
      - merchantJwt: []
      summary: Read a payment
      tags:
      - Payments
  /api/v1/merchants/{merchantId}/payments/{paymentId}/authorize:
    post:
      description: |-
        Asks the acquirer to reserve the money. An approval moves the payment to                     AUTHORIZED and a refusal to DECLINED, keeping the reason the acquirer                     gave.

        Nothing is posted to the books. An authorization is a promise that the                     money is there rather than a movement of it, and the ledger records                     movements. Capturing is what moves it.

        Only the last four digits of the card are kept.

        Requires the PAYMENT_WRITE permission, held by: OWNER, ADMIN. The caller must be acting for the merchant in the path.
      operationId: authorize
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: paymentId
        required: true
        schema:
          type: string
          format: uuid
      - description: "Names this attempt, so that repeating it cannot repeat its effect.\
          \ Sending the same key again returns what the first call produced, with\
          \ the same status, so a retry after a lost response is safe. The same key\
          \ with a different body is refused. A key belongs to one merchant and one\
          \ operation."
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          maxLength: 200
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
          description: "The payment, authorized or declined"
        "400":
          $ref: "#/components/responses/VALIDATION_FAILED"
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
        "409":
          $ref: "#/components/responses/CONFLICT"
          description: That key was already used for a different request
        "422":
          $ref: "#/components/responses/UNPROCESSABLE"
        "504":
          $ref: "#/components/responses/UPSTREAM_TIMEOUT"
      security:
      - merchantJwt: []
      summary: Authorize a payment
      tags:
      - Payments
  /api/v1/merchants/{merchantId}/payments/{paymentId}/capture:
    post:
      description: |-
        Takes the money the acquirer is holding and records the movement in the                     books: the platform's clearing account is debited and the merchant's                     settlement account is credited, by the same amount. The payment is marked                     captured last, so its state never runs ahead of what the ledger says.

        The merchant must have opened a settlement account in the payment's                     currency. If they have not, this is refused and says which account is                     missing, because the ledger does not open accounts on anybody's behalf.

        Safe to send again. The acquirer answers a repeated capture with the one                     it already made, and the entry carries the payment's own reference, so a                     capture whose answer was lost is finished by repeating it rather than by                     taking the money twice.

        Requires the PAYMENT_WRITE permission, held by: OWNER, ADMIN. The caller must be acting for the merchant in the path.
      operationId: capture
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: paymentId
        required: true
        schema:
          type: string
          format: uuid
      - description: "Names this attempt, so that repeating it cannot repeat its effect.\
          \ Sending the same key again returns what the first call produced, with\
          \ the same status, so a retry after a lost response is safe. The same key\
          \ with a different body is refused. A key belongs to one merchant and one\
          \ operation."
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          maxLength: 200
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
          description: "The payment, captured, with its entry"
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
        "409":
          $ref: "#/components/responses/CONFLICT"
          description: That key was already used for a different request
        "422":
          $ref: "#/components/responses/UNPROCESSABLE"
        "504":
          $ref: "#/components/responses/UPSTREAM_TIMEOUT"
      security:
      - merchantJwt: []
      summary: Capture an authorized payment
      tags:
      - Payments
  /api/v1/merchants/{merchantId}/payments/{paymentId}/refunds:
    get:
      description: |-
        Most recent first.

        Requires the PAYMENT_READ permission, held by: OWNER, ADMIN, ANALYST, VIEWER. The caller must be acting for the merchant in the path.
      operationId: refunds
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: paymentId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RefundResponse"
          description: The payment's refunds
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
      security:
      - merchantJwt: []
      summary: List a payment's refunds
      tags:
      - Payments
    post:
      description: |-
        Gives money back through the acquirer and records the movement as an entry                     that names the capture it reverses. Nothing is deleted and the capture is                     not touched: a correction is a new movement naming the old one, so the                     history says what happened rather than what somebody wishes had.

        A payment may be refunded more than once until the captured amount is                     exhausted. The total can never exceed what was captured, and that holds                     under concurrent requests, not only polite ones.

        Only a captured payment can be refunded. Releasing a reservation that was                     never taken is a void, and the two have different consequences in the                     books.

        The reference is the merchant's own name for the refund and is unique                     within the payment, so a caller who never received this response can send                     it again and cannot refund twice.

        Requires the PAYMENT_WRITE permission, held by: OWNER, ADMIN. The caller must be acting for the merchant in the path.
      operationId: refund
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: paymentId
        required: true
        schema:
          type: string
          format: uuid
      - description: "Names this attempt, so that repeating it cannot repeat its effect.\
          \ Sending the same key again returns what the first call produced, with\
          \ the same status, so a retry after a lost response is safe. The same key\
          \ with a different body is refused. A key belongs to one merchant and one\
          \ operation."
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          maxLength: 200
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundResponse"
          description: "The refund, as made"
        "400":
          $ref: "#/components/responses/VALIDATION_FAILED"
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
        "409":
          $ref: "#/components/responses/CONFLICT"
          description: That key was already used for a different request
        "422":
          $ref: "#/components/responses/UNPROCESSABLE"
        "504":
          $ref: "#/components/responses/UPSTREAM_TIMEOUT"
      security:
      - merchantJwt: []
      summary: "Refund a captured payment, in full or in part"
      tags:
      - Payments
  /api/v1/merchants/{merchantId}/payments/{paymentId}/void:
    post:
      description: |-
        Releases the money the acquirer is holding. Nothing is posted to the                     books: no money moved, and an entry recording a movement that did not                     happen is worse than no entry at all.

        Requires the PAYMENT_WRITE permission, held by: OWNER, ADMIN. The caller must be acting for the merchant in the path.
      operationId: voidPayment
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: paymentId
        required: true
        schema:
          type: string
          format: uuid
      - description: "Names this attempt, so that repeating it cannot repeat its effect.\
          \ Sending the same key again returns what the first call produced, with\
          \ the same status, so a retry after a lost response is safe. The same key\
          \ with a different body is refused. A key belongs to one merchant and one\
          \ operation."
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          maxLength: 200
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
          description: "The payment, voided"
        "400":
          $ref: "#/components/responses/VALIDATION_FAILED"
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
        "409":
          $ref: "#/components/responses/CONFLICT"
          description: That key was already used for a different request
        "422":
          $ref: "#/components/responses/UNPROCESSABLE"
      security:
      - merchantJwt: []
      summary: Void an authorized payment
      tags:
      - Payments
  /api/v1/merchants/{merchantId}/reviews:
    get:
      description: |-
        Oldest first, because the oldest is the customer who has been waiting longest and because a queue worked newest-first grows a tail nobody reaches.

        A payment leaves this list when somebody rules on it, or when it expires on its own. Nothing here has been charged: the money was never reserved.

        Requires the REVIEW_RULE permission, held by: OWNER, ADMIN, ANALYST. The caller must be acting for the merchant in the path.
      operationId: waiting
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentResponse"
          description: The payments waiting to be ruled on
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
      security:
      - merchantJwt: []
      summary: What is waiting for a person
      tags:
      - Reviews
  /api/v1/merchants/{merchantId}/reviews/rulings:
    get:
      description: |-
        Most recent first, with what the scorer had said at the time, so an analyst can see their colleagues' decisions rather than making the same one again differently.

        Beside them, how far this merchant's line has drifted from where a person set it. What analysts decided and what the platform learned from it are the same question asked twice, so they are answered in one place.

        `known` is false when the scorer could not be asked. The drift is then absent rather than zero: zero is a fact about a merchant whose line has not moved.

        Requires the REVIEW_RULE permission, held by: OWNER, ADMIN, ANALYST. The caller must be acting for the merchant in the path.
      operationId: ruled
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: "The rulings, and the drift"
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
      security:
      - merchantJwt: []
      summary: "What has already been ruled, and what the platform learned from it"
      tags:
      - Reviews
  /api/v1/merchants/{merchantId}/reviews/{paymentId}/refuse:
    post:
      description: |-
        Agrees with the scorer. Nobody was charged, and now nobody will be.

        Recorded against the merchant like any other ruling, so that a pattern of agreement moves this merchant's line the same way a pattern of disagreement does.

        Requires the REVIEW_RULE permission, held by: OWNER, ADMIN, ANALYST. The caller must be acting for the merchant in the path.
      operationId: refuse
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: paymentId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: caller
        required: true
        schema:
          $ref: "#/components/schemas/Caller"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulingRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
          description: "The payment, refused"
        "400":
          $ref: "#/components/responses/VALIDATION_FAILED"
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
        "422":
          $ref: "#/components/responses/UNPROCESSABLE"
      security:
      - merchantJwt: []
      summary: Refuse a held payment
      tags:
      - Reviews
  /api/v1/merchants/{merchantId}/reviews/{paymentId}/release:
    post:
      description: |-
        Says the scorer was wrong about this one. The payment can then be authorized, and will not be scored again: a person has overruled the scorer, and asking it a second time would let it overrule them back.

        Deliberately does not authorize it. Taking the money stays a thing the merchant does, through the same endpoint as any other payment, so that an analyst's click never charges a customer.

        Who ruled is taken from the access token, never from this request, and a merchant's own API key may not rule at all.

        Requires the REVIEW_RULE permission, held by: OWNER, ADMIN, ANALYST. The caller must be acting for the merchant in the path.
      operationId: release
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: paymentId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: caller
        required: true
        schema:
          $ref: "#/components/schemas/Caller"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulingRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
          description: "The payment, released"
        "400":
          $ref: "#/components/responses/VALIDATION_FAILED"
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
        "422":
          $ref: "#/components/responses/UNPROCESSABLE"
      security:
      - merchantJwt: []
      summary: Release a held payment
      tags:
      - Reviews
  /api/v1/merchants/{merchantId}/summary:
    get:
      description: |-
        Counted by the database, never by the caller. What was attempted, what went through, what money moved per currency, a row per day with the volume behind each rate, why payments were refused split between the acquirer and this platform, and what is outstanding right now.

        The authorization rate is null rather than zero when nothing was attempted: a rate of zero says every payment failed, and no payments at all says something else entirely.

        What needs somebody is not scoped to the range. A payment held three weeks ago is still held, and nobody should have to widen a date filter to find out that a customer is waiting.

        Requires the PAYMENT_READ permission, held by: OWNER, ADMIN, ANALYST, VIEWER. The caller must be acting for the merchant in the path.
      operationId: summary
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - description: Inclusive. Defaults to thirty days ago.
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - description: Exclusive. Defaults to now.
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      - description: "Which days these are, as an IANA zone. A merchant in Istanbul\
          \ asking about Tuesday means their Tuesday."
        example: Europe/Istanbul
        in: query
        name: zone
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: The summary
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "422":
          $ref: "#/components/responses/UNPROCESSABLE"
      security:
      - merchantJwt: []
      summary: How business is
      tags:
      - Payments
components:
  headers:
    X-Correlation-Id:
      description: "The correlation id this request was handled under. Echoed from\
        \ the request when it sent one, generated at the edge otherwise."
      schema:
        type: string
  responses:
    CONFLICT:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 409 conflict. The body carries code CONFLICT.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    CONTENDED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 409 contended. The body carries code CONTENDED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    FORBIDDEN:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 403 forbidden. The body carries code FORBIDDEN.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    IDEMPOTENCY_KEY_REUSED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 409 idempotency-key-reused. The body carries code IDEMPOTENCY_KEY_REUSED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    INTERNAL_ERROR:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 500 internal-error. The body carries code INTERNAL_ERROR.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    MALFORMED_REQUEST:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 400 malformed-request. The body carries code MALFORMED_REQUEST.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    METHOD_NOT_ALLOWED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 405 method-not-allowed. The body carries code METHOD_NOT_ALLOWED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    NOT_FOUND:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 404 not-found. The body carries code NOT_FOUND.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    RATE_LIMITED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 429 rate-limited. The body carries code RATE_LIMITED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UNAUTHORIZED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 401 unauthorized. The body carries code UNAUTHORIZED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UNPROCESSABLE:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 422 unprocessable. The body carries code UNPROCESSABLE.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UPSTREAM_TIMEOUT:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 504 upstream-timeout. The body carries code UPSTREAM_TIMEOUT.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UPSTREAM_UNAVAILABLE:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 503 upstream-unavailable. The body carries code UPSTREAM_UNAVAILABLE.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    VALIDATION_FAILED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 400 validation-failed. The body carries code VALIDATION_FAILED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
  schemas:
    AuthorizeRequest:
      type: object
      description: The card to authorize against
      properties:
        card:
          type: string
          description: "The card. Only its last four digits are kept, and the acquirer\
            \ decides what to do from them: see its own documentation for the catalogue."
          example: "4000000000000000"
          minLength: 1
          pattern: "[0-9]{12,19}"
      required:
      - card
    Caller:
      type: object
      properties:
        merchantId:
          type: string
          format: uuid
        person:
          type: boolean
        principal:
          type: string
          enum:
          - USER
          - API_KEY
        roles:
          type: array
          items:
            type: string
            enum:
            - OWNER
            - ADMIN
            - ANALYST
            - VIEWER
          uniqueItems: true
        userId:
          type: string
          format: uuid
    CreatePaymentRequest:
      type: object
      description: A payment about to be attempted
      properties:
        amount:
          type: integer
          format: int64
          description: Minor units. 12550 TRY means 125.50.
          example: 125000
          minimum: 0
        currency:
          type: string
          description: ISO 4217
          example: TRY
          minLength: 1
          pattern: "[A-Z]{3}"
        description:
          type: string
          description: For a person reading it later
          example: Two bags of coffee
          maxLength: 500
          minLength: 0
        reference:
          type: string
          description: "What the merchant calls this payment. Unique within the merchant,\
            \ so their own reconciliation has something to join on."
          example: order-10241
          maxLength: 200
          minLength: 0
      required:
      - currency
      - reference
    FieldViolation:
      description: "One rejected field, in the shape a form can render beside the\
        \ input."
      properties:
        field:
          type: string
          description: The field that was rejected.
        message:
          type: string
          description: Why it was rejected.
      required:
      - field
      - message
    PaymentResponse:
      type: object
      description: "A payment, and where it has got to"
      properties:
        acquirerReference:
          type: string
          description: "The acquirer's reference, once there is an authorization"
        allowedNext:
          type: array
          description: Where this payment may go next. Empty when it is finished.
          items:
            type: string
            enum:
            - CREATED
            - AUTHORIZATION_UNKNOWN
            - HELD_FOR_REVIEW
            - AUTHORIZED
            - DECLINED
            - CAPTURED
            - VOIDED
          uniqueItems: true
        amount:
          type: integer
          format: int64
        cardLastFour:
          type: string
          description: "The last four digits of the card, and all that is kept"
        createdAt:
          type: string
          format: date-time
        currency:
          type: string
        declineReason:
          type: string
          description: "Why the acquirer refused, if it did"
        description:
          type: string
        history:
          type: array
          description: Oldest first
          items:
            $ref: "#/components/schemas/TransitionResponse"
        id:
          type: string
          format: uuid
        ledgerEntryId:
          type: string
          format: uuid
          description: "The entry in the ledger that records the money moving. Present\
            \ once the payment is captured, and never on one that was voided, because\
            \ a released reservation moved nothing."
        merchantId:
          type: string
          format: uuid
        reference:
          type: string
        refundableAmount:
          type: integer
          format: int64
          description: What could still be given back. Zero unless the payment is
            captured and not wholly refunded.
        refundedAmount:
          type: integer
          format: int64
          description: What has been given back so far
        reviewRuledAt:
          type: string
          format: date-time
          description: When they did
        reviewRuledBy:
          type: string
          description: "Which person ruled. Never an API key: a review is somebody's\
            \ judgement, and a control a merchant can automate away is not a control."
        reviewRuling:
          type: string
          description: "What an analyst decided about a payment this platform held:\
            \ RELEASED or REFUSED. Null on one nobody has ruled on, including one\
            \ still waiting."
          example: RELEASED
        riskReasons:
          type: string
          description: "What the scorer objected to, in words. A merchant asking why\
            \ a payment was held is asking for this."
        riskScore:
          type: integer
          format: int32
          description: What it added up to. Higher is riskier.
        riskVerdict:
          type: string
          description: "What this platform thought of the payment: APPROVE, REVIEW,\
            \ BLOCK, or UNAVAILABLE when the scorer could not be asked. Null on a\
            \ payment that was never scored."
          example: REVIEW
        status:
          type: string
          enum:
          - CREATED
          - AUTHORIZATION_UNKNOWN
          - HELD_FOR_REVIEW
          - AUTHORIZED
          - DECLINED
          - CAPTURED
          - VOIDED
        updatedAt:
          type: string
          format: date-time
    Problem:
      description: An RFC 9457 problem detail. The body of every failing request.
      example:
        code: VALIDATION_FAILED
        correlationId: 9f1c4e2a7b3d4f10
        detail: The request failed validation.
        errors:
        - field: amount.minorUnits
          message: must be greater than 0
        instance: /api/v1/payments
        status: 400
        timestamp: 2026-08-27T09:15:00Z
        title: validation-failed
        type: https://mizan.kauzes.dev/errors/validation-failed
      properties:
        code:
          type: string
          description: The stable machine readable error. Branch on this.
          enum:
          - VALIDATION_FAILED
          - MALFORMED_REQUEST
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - CONFLICT
          - IDEMPOTENCY_KEY_REUSED
          - CONTENDED
          - UNPROCESSABLE
          - RATE_LIMITED
          - INTERNAL_ERROR
          - UPSTREAM_UNAVAILABLE
          - UPSTREAM_TIMEOUT
        correlationId:
          type: string
          description: "The id this request was handled under, for finding it in the\
            \ logs."
        detail:
          type: string
          description: "What went wrong, when the error was raised deliberately. An\
            \ unexpected failure carries a fixed message and no internals."
        errors:
          type: array
          description: "Present only on a validation failure, one entry per field."
          items:
            $ref: "#/components/schemas/FieldViolation"
        instance:
          type: string
          format: uri
          description: The path of the request that failed.
        status:
          format: int32
          description: "The HTTP status, derived from the code."
        timestamp:
          type: string
          format: date-time
          description: When the error was produced.
        title:
          type: string
          description: The code in readable form.
        type:
          type: string
          format: uri
          description: Identifies the error. It is not required to resolve.
      required:
      - code
      - correlationId
      - status
      - timestamp
      - title
      - type
    RefundRequest:
      type: object
      description: Money to give back
      properties:
        amount:
          type: integer
          format: int64
          description: "Minor units, at most what is left unrefunded"
          example: 25000
          minimum: 0
        currency:
          type: string
          description: "The payment's currency. Optional, and checked if given: a\
            \ refund in another currency is a mistake rather than a conversion."
          example: TRY
        reason:
          type: string
          example: the customer returned one of two items
          maxLength: 500
          minLength: 0
        reference:
          type: string
          description: "The merchant's own name for this refund, unique within the\
            \ payment. Sending it again returns the first refund rather than making\
            \ a second."
          example: order-1043-return
          maxLength: 200
          minLength: 0
      required:
      - reference
    RefundResponse:
      type: object
      description: Money given back
      properties:
        acquirerReference:
          type: string
          description: The acquirer's reference for the money going back
        amount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        currency:
          type: string
        id:
          type: string
          format: uuid
        ledgerEntryId:
          type: string
          format: uuid
          description: The entry in the ledger that records it
        paymentId:
          type: string
          format: uuid
        reason:
          type: string
        reference:
          type: string
        status:
          type: string
          enum:
          - REQUESTED
          - RETURNED
          - SUCCEEDED
          - FAILED
          - ABANDONED
    RulingRequest:
      type: object
      description: An analyst's reason for a ruling
      properties:
        why:
          type: string
          example: "known customer, they called to confirm"
          maxLength: 1000
          minLength: 0
      required:
      - why
    TransitionResponse:
      type: object
      description: One step a payment took
      properties:
        at:
          type: string
          format: date-time
        from:
          type: string
          description: Null for the first step
          enum:
          - CREATED
          - AUTHORIZATION_UNKNOWN
          - HELD_FOR_REVIEW
          - AUTHORIZED
          - DECLINED
          - CAPTURED
          - VOIDED
        reason:
          type: string
        to:
          type: string
          enum:
          - CREATED
          - AUTHORIZATION_UNKNOWN
          - HELD_FOR_REVIEW
          - AUTHORIZED
          - DECLINED
          - CAPTURED
          - VOIDED
    VoidRequest:
      type: object
      description: Why the reservation is being released
      properties:
        reason:
          type: string
          description: "Kept on the step, so somebody reading the history later can\
            \ see why rather than only that."
          example: the customer cancelled the order
          maxLength: 500
          minLength: 0
  securitySchemes:
    merchantApiKey:
      description: "The merchant's API key, naming which key signed the request. Public,\
        \ and not a secret. Issued at POST /api/v1/merchants/{merchantId}/api-keys,\
        \ which returns the signing secret once. Paired with merchantSignature and\
        \ merchantTimestamp; a key on its own is not enough."
      in: header
      name: X-Mizan-Key
      type: apiKey
    merchantJwt:
      bearerFormat: JWT
      description: "A short lived access token issued by identity-service, sent as\
        \ an Authorization bearer header. Obtained from POST /api/v1/tokens and renewed\
        \ at /api/v1/tokens/refresh. The gateway verifies it and passes the established\
        \ identity on; a service never sees the token itself."
      scheme: bearer
      type: http
    merchantSignature:
      description: |-
        HMAC-SHA256 of the canonical request under the key's secret, in lowercase hex.

        The canonical request is four lines joined with a newline: the uppercase method, the path, the value of X-Mizan-Timestamp, and the SHA-256 of the body in lowercase hex, which for a request with no body is the digest of the empty string.

            POST
            /api/v1/payments
            1788100000
            e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855

        Method and path are covered so a captured signature cannot be aimed at another endpoint, the body so it cannot be replayed with different numbers in it, and the timestamp so it cannot be replayed at all.
      in: header
      name: X-Mizan-Signature
      type: apiKey
    merchantTimestamp:
      description: "Unix seconds at which the request was signed. A request whose\
        \ timestamp is further from the platform's clock than the accepted window,\
        \ five minutes by default, is refused whatever its signature says."
      in: header
      name: X-Mizan-Timestamp
      type: apiKey
