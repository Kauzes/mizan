openapi: 3.1.0
info:
  description: |-
    Part of the Mizan payments platform. Every service is reached through the gateway under /api/v1.

    Errors are RFC 9457 problem details. The code field is the contract: it comes from a closed set, never changes meaning, and the HTTP status is derived from it. Branch on the code rather than on the status or the message. The responses under components.responses are named after those codes.

    Every request carries a correlation id. Send one in X-Correlation-Id and it is echoed back and printed on every log line the request touches; send none and one is generated at the edge. Quote it when reporting a problem.
  title: notification-service
  version: 0.1.0
servers:
- description: The local gateway. Services are not addressed directly.
  url: http://localhost:8080
tags:
- description: "What a merchant is to be told, and about what"
  name: Notifications
- description: "Where a merchant is told what happened, without polling"
  name: Webhooks
paths:
  /api/v1/merchants/{merchantId}/notifications:
    get:
      description: |-
        Most recent first. Scoped to the merchant in the path.

        Requires the NOTIFICATION_READ permission, held by: OWNER, ADMIN, ANALYST, VIEWER. The caller must be acting for the merchant in the path.
      operationId: list_2
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationResponse"
          description: The merchant's notifications
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
      security:
      - merchantJwt: []
      summary: List a merchant's notifications
      tags:
      - Notifications
  /api/v1/merchants/{merchantId}/webhook-endpoints:
    get:
      description: |-
        Most recent first.

        Requires the WEBHOOK_READ permission, held by: OWNER, ADMIN, ANALYST, VIEWER. The caller must be acting for the merchant in the path.
      operationId: list
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EndpointResponse"
          description: The merchant's endpoints
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
      security:
      - merchantJwt: []
      summary: List a merchant's endpoints
      tags:
      - Webhooks
    post:
      description: |-
        Returns the signing secret, once. It is stored encrypted and will not be shown again; if it is lost, rotate it.

        ## Verifying a delivery

        Every delivery carries three headers:

        - `X-Mizan-Signature` — `sha256=` followed by the lowercase hex HMAC
        - `X-Mizan-Timestamp` — when it was signed, as Unix seconds
        - `X-Mizan-Delivery` — the delivery's id, the same on every retry

        Compute `HMAC-SHA256(secret, timestamp + "." + body)` over the raw request body, exactly as received and before any parsing, and compare it to the signature with a constant-time comparison. Reject anything whose timestamp is more than five minutes from your clock, or a captured delivery can be replayed at you forever.

        The timestamp is inside the signed string on purpose: signing only the body would let somebody who recorded one delivery send it again unchanged, and the signature would still be valid.

        ## What is refused

        The URL must be https, and must resolve to an address on the public internet. An endpoint pointing inside this platform's own network would make this a way to have Mizan send requests to Mizan on your behalf.

        Requires the WEBHOOK_MANAGE permission, held by: OWNER, ADMIN. The caller must be acting for the merchant in the path.
      operationId: register
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - description: "Names this attempt, so that repeating it cannot repeat its effect.\
          \ Sending the same key again returns what the first call produced, with\
          \ the same status, so a retry after a lost response is safe. The same key\
          \ with a different body is refused. A key belongs to one merchant and one\
          \ operation."
        in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          maxLength: 200
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterEndpointRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretResponse"
          description: "The endpoint, and its secret, once"
        "400":
          $ref: "#/components/responses/VALIDATION_FAILED"
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "409":
          $ref: "#/components/responses/CONFLICT"
        "422":
          $ref: "#/components/responses/UNPROCESSABLE"
      security:
      - merchantJwt: []
      summary: Register an endpoint
      tags:
      - Webhooks
  /api/v1/merchants/{merchantId}/webhook-endpoints/{endpointId}:
    delete:
      description: |-
        Its delivery history goes with it. To stop deliveries and keep the history, disable it instead.

        Requires the WEBHOOK_MANAGE permission, held by: OWNER, ADMIN. The caller must be acting for the merchant in the path.
      operationId: delete
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: endpointId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: It is gone
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
      security:
      - merchantJwt: []
      summary: Remove an endpoint
      tags:
      - Webhooks
    get:
      description: "Requires the WEBHOOK_READ permission, held by: OWNER, ADMIN, ANALYST,\
        \ VIEWER. The caller must be acting for the merchant in the path."
      operationId: find
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: endpointId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointResponse"
          description: The endpoint
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
      security:
      - merchantJwt: []
      summary: Read an endpoint
      tags:
      - Webhooks
    patch:
      description: |-
        Disabling keeps the endpoint and its delivery history. Deleting does not.

        Requires the WEBHOOK_MANAGE permission, held by: OWNER, ADMIN. The caller must be acting for the merchant in the path.
      operationId: update
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: endpointId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEndpointRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointResponse"
          description: The endpoint as it now stands
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
        "422":
          $ref: "#/components/responses/UNPROCESSABLE"
      security:
      - merchantJwt: []
      summary: "Change what an endpoint receives, or stop it receiving"
      tags:
      - Webhooks
  /api/v1/merchants/{merchantId}/webhook-endpoints/{endpointId}/deliveries:
    get:
      description: |-
        Most recent first, with the status, the last response code and when it was delivered.

        Requires the WEBHOOK_READ permission, held by: OWNER, ADMIN, ANALYST, VIEWER. The caller must be acting for the merchant in the path.
      operationId: list_1
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: endpointId
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: {}
          description: The deliveries
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
      security:
      - merchantJwt: []
      summary: What has been sent to this endpoint
      tags:
      - Webhooks
  /api/v1/merchants/{merchantId}/webhook-endpoints/{endpointId}/deliveries/{deliveryId}/attempts:
    get:
      description: |-
        Each with its response code, how long it took, and what went wrong. Keeping only the last attempt would answer "is it working now", which is the one question a merchant can already answer themselves.

        Requires the WEBHOOK_READ permission, held by: OWNER, ADMIN, ANALYST, VIEWER. The caller must be acting for the merchant in the path.
      operationId: attempts
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: endpointId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: deliveryId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: {}
          description: "The attempts, oldest first"
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
      security:
      - merchantJwt: []
      summary: Every attempt at one delivery
      tags:
      - Webhooks
  /api/v1/merchants/{merchantId}/webhook-endpoints/{endpointId}/deliveries/{deliveryId}/redeliver:
    post:
      description: |-
        Queues the delivery again from attempt zero, with the same body and the same delivery id it had the first time. A merchant who received it already will recognise the repeat.

        Requires the WEBHOOK_MANAGE permission, held by: OWNER, ADMIN. The caller must be acting for the merchant in the path.
      operationId: redeliver
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: endpointId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: deliveryId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "202":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: It is queued
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
      security:
      - merchantJwt: []
      summary: Send one again
      tags:
      - Webhooks
  /api/v1/merchants/{merchantId}/webhook-endpoints/{endpointId}/secret:
    post:
      description: |-
        Returns the new secret, once. Rotation takes effect immediately: every delivery after this call is signed with the new secret, and a receiver still checking the old one will reject them.

        That is deliberate. Accepting both for a while would be a rotation that never finishes and an old secret that is never actually revoked. Deploy the new secret first, or disable the endpoint while you do.

        Requires the WEBHOOK_MANAGE permission, held by: OWNER, ADMIN. The caller must be acting for the merchant in the path.
      operationId: rotate
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: endpointId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretResponse"
          description: "The endpoint, and its new secret, once"
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
      security:
      - merchantJwt: []
      summary: Rotate the signing secret
      tags:
      - Webhooks
components:
  headers:
    X-Correlation-Id:
      description: "The correlation id this request was handled under. Echoed from\
        \ the request when it sent one, generated at the edge otherwise."
      schema:
        type: string
  responses:
    CONFLICT:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 409 conflict. The body carries code CONFLICT.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    CONTENDED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 409 contended. The body carries code CONTENDED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    FORBIDDEN:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 403 forbidden. The body carries code FORBIDDEN.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    IDEMPOTENCY_KEY_REUSED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 409 idempotency-key-reused. The body carries code IDEMPOTENCY_KEY_REUSED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    INTERNAL_ERROR:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 500 internal-error. The body carries code INTERNAL_ERROR.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    MALFORMED_REQUEST:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 400 malformed-request. The body carries code MALFORMED_REQUEST.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    METHOD_NOT_ALLOWED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 405 method-not-allowed. The body carries code METHOD_NOT_ALLOWED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    NOT_FOUND:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 404 not-found. The body carries code NOT_FOUND.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    RATE_LIMITED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 429 rate-limited. The body carries code RATE_LIMITED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UNAUTHORIZED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 401 unauthorized. The body carries code UNAUTHORIZED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UNPROCESSABLE:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 422 unprocessable. The body carries code UNPROCESSABLE.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UPSTREAM_TIMEOUT:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 504 upstream-timeout. The body carries code UPSTREAM_TIMEOUT.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UPSTREAM_UNAVAILABLE:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 503 upstream-unavailable. The body carries code UPSTREAM_UNAVAILABLE.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    VALIDATION_FAILED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 400 validation-failed. The body carries code VALIDATION_FAILED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
  schemas:
    EndpointResponse:
      type: object
      description: A registered endpoint
      properties:
        createdAt:
          type: string
          format: date-time
        description:
          type: string
        enabled:
          type: boolean
        eventTypes:
          type: array
          items:
            type: string
          uniqueItems: true
        id:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        secretRotatedAt:
          type: string
          format: date-time
          description: When the secret was last replaced. The secret itself is never
            returned after it is issued.
        updatedAt:
          type: string
          format: date-time
        url:
          type: string
    FieldViolation:
      description: "One rejected field, in the shape a form can render beside the\
        \ input."
      properties:
        field:
          type: string
          description: The field that was rejected.
        message:
          type: string
          description: Why it was rejected.
      required:
      - field
      - message
    NotificationResponse:
      type: object
      description: Something the merchant should be told
      properties:
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        kind:
          type: string
          example: PAYMENT_CAPTURED
        message:
          type: string
          example: You have been paid 1250.00 TRY for order-77.
        paymentId:
          type: string
          format: uuid
    Problem:
      description: An RFC 9457 problem detail. The body of every failing request.
      example:
        code: VALIDATION_FAILED
        correlationId: 9f1c4e2a7b3d4f10
        detail: The request failed validation.
        errors:
        - field: amount.minorUnits
          message: must be greater than 0
        instance: /api/v1/payments
        status: 400
        timestamp: 2026-08-27T09:15:00Z
        title: validation-failed
        type: https://mizan.kauzes.dev/errors/validation-failed
      properties:
        code:
          type: string
          description: The stable machine readable error. Branch on this.
          enum:
          - VALIDATION_FAILED
          - MALFORMED_REQUEST
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - CONFLICT
          - IDEMPOTENCY_KEY_REUSED
          - CONTENDED
          - UNPROCESSABLE
          - RATE_LIMITED
          - INTERNAL_ERROR
          - UPSTREAM_UNAVAILABLE
          - UPSTREAM_TIMEOUT
        correlationId:
          type: string
          description: "The id this request was handled under, for finding it in the\
            \ logs."
        detail:
          type: string
          description: "What went wrong, when the error was raised deliberately. An\
            \ unexpected failure carries a fixed message and no internals."
        errors:
          type: array
          description: "Present only on a validation failure, one entry per field."
          items:
            $ref: "#/components/schemas/FieldViolation"
        instance:
          type: string
          format: uri
          description: The path of the request that failed.
        status:
          format: int32
          description: "The HTTP status, derived from the code."
        timestamp:
          type: string
          format: date-time
          description: When the error was produced.
        title:
          type: string
          description: The code in readable form.
        type:
          type: string
          format: uri
          description: Identifies the error. It is not required to resolve.
      required:
      - code
      - correlationId
      - status
      - timestamp
      - title
      - type
    RegisterEndpointRequest:
      type: object
      description: "Somewhere to be told, and what about"
      properties:
        description:
          type: string
          example: Production order service
          maxLength: 200
          minLength: 0
        eventTypes:
          type: array
          description: Which events this endpoint should receive
          example:
          - payment.captured
          - payment.refunded
          items:
            type: string
          minItems: 1
          uniqueItems: true
        url:
          type: string
          description: "Must be https, and must resolve to an address on the public\
            \ internet. An endpoint inside this platform's own network is refused."
          example: https://api.example.com/webhooks/mizan
          maxLength: 2000
          minLength: 0
      required:
      - eventTypes
      - url
    SecretResponse:
      type: object
      description: "A registered endpoint and its signing secret, shown once"
      properties:
        endpoint:
          $ref: "#/components/schemas/EndpointResponse"
          description: The endpoint
        secret:
          type: string
          description: "Keep this. It is shown now and never again, and it is what\
            \ you verify a delivery's signature with."
          example: whsec_Zm9vYmFyYmF6cXV1eA
    UpdateEndpointRequest:
      type: object
      description: What to change about an endpoint
      properties:
        enabled:
          type: boolean
          description: Stop or resume deliveries. Disabling keeps the endpoint and
            its history; deleting does not.
        eventTypes:
          type: array
          description: "Replaces what it subscribes to, if given"
          items:
            type: string
          uniqueItems: true
  securitySchemes:
    merchantApiKey:
      description: "The merchant's API key, naming which key signed the request. Public,\
        \ and not a secret. Issued at POST /api/v1/merchants/{merchantId}/api-keys,\
        \ which returns the signing secret once. Paired with merchantSignature and\
        \ merchantTimestamp; a key on its own is not enough."
      in: header
      name: X-Mizan-Key
      type: apiKey
    merchantJwt:
      bearerFormat: JWT
      description: "A short lived access token issued by identity-service, sent as\
        \ an Authorization bearer header. Obtained from POST /api/v1/tokens and renewed\
        \ at /api/v1/tokens/refresh. The gateway verifies it and passes the established\
        \ identity on; a service never sees the token itself."
      scheme: bearer
      type: http
    merchantSignature:
      description: |-
        HMAC-SHA256 of the canonical request under the key's secret, in lowercase hex.

        The canonical request is four lines joined with a newline: the uppercase method, the path, the value of X-Mizan-Timestamp, and the SHA-256 of the body in lowercase hex, which for a request with no body is the digest of the empty string.

            POST
            /api/v1/payments
            1788100000
            e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855

        Method and path are covered so a captured signature cannot be aimed at another endpoint, the body so it cannot be replayed with different numbers in it, and the timestamp so it cannot be replayed at all.
      in: header
      name: X-Mizan-Signature
      type: apiKey
    merchantTimestamp:
      description: "Unix seconds at which the request was signed. A request whose\
        \ timestamp is further from the platform's clock than the accepted window,\
        \ five minutes by default, is refused whatever its signature says."
      in: header
      name: X-Mizan-Timestamp
      type: apiKey
