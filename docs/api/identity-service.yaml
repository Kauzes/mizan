openapi: 3.1.0
info:
  description: |-
    Part of the Mizan payments platform. Every service is reached through the gateway under /api/v1.

    Errors are RFC 9457 problem details. The code field is the contract: it comes from a closed set, never changes meaning, and the HTTP status is derived from it. Branch on the code rather than on the status or the message. The responses under components.responses are named after those codes.

    Every request carries a correlation id. Send one in X-Correlation-Id and it is echoed back and printed on every log line the request touches; send none and one is generated at the edge. Quote it when reporting a problem.
  title: identity-service
  version: 0.1.0
servers:
- description: The local gateway. Services are not addressed directly.
  url: http://localhost:8080
tags:
- description: Credentials a merchant's server signs requests with
  name: API keys
- description: "Signing in, and staying signed in"
  name: Tokens
- description: The public key access tokens are signed with
  name: Keys
- description: Opening an account and reading who acts for it
  name: Merchants
- description: "Who acts for a merchant, and what they may do"
  name: Users
paths:
  /.well-known/jwks.json:
    get:
      description: A JWKS. Verifiers fetch this rather than being handed a secret.
      operationId: jwks
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: OK
      summary: "The signing keys, public halves only"
      tags:
      - Keys
  /api/v1/merchants:
    post:
      description: Creates the merchant and the owner account together. Either both
        exist afterwards or neither does.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterMerchantRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
          description: The merchant and its owner
        "400":
          $ref: "#/components/responses/VALIDATION_FAILED"
        "409":
          $ref: "#/components/responses/CONFLICT"
      summary: Register a merchant
      tags:
      - Merchants
  /api/v1/merchants/{merchantId}:
    get:
      description: "Requires the MERCHANT_READ permission, held by: OWNER, ADMIN,\
        \ ANALYST, VIEWER. The caller must be acting for the merchant in the path."
      operationId: find
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantResponse"
          description: The merchant
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
      security:
      - merchantJwt: []
      summary: Read a merchant
      tags:
      - Merchants
  /api/v1/merchants/{merchantId}/api-keys:
    get:
      description: |-
        Secrets are not included, and cannot be retrieved after issue.

        Requires the API_KEY_MANAGE permission, held by: OWNER. The caller must be acting for the merchant in the path.
      operationId: list_1
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKeyResponse"
          description: "The merchant's keys, oldest first"
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
      security:
      - merchantJwt: []
      summary: List a merchant's API keys
      tags:
      - API keys
    post:
      description: |-
        The response carries the secret. It is the only time it is returned: the stored copy is encrypted and no endpoint gives it back.

        Requires the API_KEY_MANAGE permission, held by: OWNER. The caller must be acting for the merchant in the path.
      operationId: issue
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueKeyRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedKeyResponse"
          description: "The key, and its secret, once"
        "400":
          $ref: "#/components/responses/VALIDATION_FAILED"
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
      security:
      - merchantJwt: []
      summary: Issue an API key
      tags:
      - API keys
  /api/v1/merchants/{merchantId}/api-keys/{keyId}:
    delete:
      description: |-
        Takes effect on the next request, not on the next cache expiry.

        Requires the API_KEY_MANAGE permission, held by: OWNER. The caller must be acting for the merchant in the path.
      operationId: revoke
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: keyId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyResponse"
          description: "The key, now revoked"
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
      security:
      - merchantJwt: []
      summary: Revoke an API key
      tags:
      - API keys
  /api/v1/merchants/{merchantId}/api-keys/{keyId}/rotate:
    post:
      description: |-
        Issues a replacement carrying the same name and role, and revokes this one. The old key stops working at once, so deploy the new secret before rotating.

        Requires the API_KEY_MANAGE permission, held by: OWNER. The caller must be acting for the merchant in the path.
      operationId: rotate
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: keyId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedKeyResponse"
          description: "The replacement key, and its secret, once"
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
        "422":
          $ref: "#/components/responses/UNPROCESSABLE"
      security:
      - merchantJwt: []
      summary: Rotate an API key
      tags:
      - API keys
  /api/v1/merchants/{merchantId}/users:
    get:
      description: |-
        Oldest first. No password or hash appears in this response.

        Requires the USER_READ permission, held by: OWNER, ADMIN. The caller must be acting for the merchant in the path.
      operationId: list
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
          description: The merchant's users
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
      security:
      - merchantJwt: []
      summary: List the users of a merchant
      tags:
      - Users
    post:
      description: "Requires the USER_MANAGE permission, held by: OWNER. The caller\
        \ must be acting for the merchant in the path."
      operationId: add
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddUserRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: The user that was added
        "400":
          $ref: "#/components/responses/VALIDATION_FAILED"
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "409":
          $ref: "#/components/responses/CONFLICT"
      security:
      - merchantJwt: []
      summary: Add a user to a merchant
      tags:
      - Users
  /api/v1/merchants/{merchantId}/users/{userId}:
    delete:
      description: "Requires the USER_MANAGE permission, held by: OWNER. The caller\
        \ must be acting for the merchant in the path."
      operationId: remove
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: The user is gone
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
        "422":
          $ref: "#/components/responses/UNPROCESSABLE"
      security:
      - merchantJwt: []
      summary: Remove a user from a merchant
      tags:
      - Users
  /api/v1/merchants/{merchantId}/users/{userId}/roles:
    put:
      description: |-
        The set sent is the set the user holds afterwards.

        Requires the ROLE_MANAGE permission, held by: OWNER. The caller must be acting for the merchant in the path.
      operationId: setRoles
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRolesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: "The user, with their new roles"
        "400":
          $ref: "#/components/responses/VALIDATION_FAILED"
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
        "422":
          $ref: "#/components/responses/UNPROCESSABLE"
      security:
      - merchantJwt: []
      summary: Replace a user's roles
      tags:
      - Users
  /api/v1/tokens:
    post:
      description: Exchanges an email and a password for an access and refresh token.
      operationId: signIn
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
          description: A new token pair
        "400":
          $ref: "#/components/responses/VALIDATION_FAILED"
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
      summary: Sign in
      tags:
      - Tokens
  /api/v1/tokens/refresh:
    post:
      description: "Spends the refresh token presented and issues a new pair. Presenting\
        \ one that was already spent revokes every token descended from that sign\
        \ in, so the session has to be started again."
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
          description: A new token pair
        "400":
          $ref: "#/components/responses/VALIDATION_FAILED"
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
      summary: Refresh a token pair
      tags:
      - Tokens
components:
  headers:
    X-Correlation-Id:
      description: "The correlation id this request was handled under. Echoed from\
        \ the request when it sent one, generated at the edge otherwise."
      schema:
        type: string
  responses:
    CONFLICT:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 409 conflict. The body carries code CONFLICT.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    FORBIDDEN:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 403 forbidden. The body carries code FORBIDDEN.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    IDEMPOTENCY_KEY_REUSED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 409 idempotency-key-reused. The body carries code IDEMPOTENCY_KEY_REUSED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    INTERNAL_ERROR:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 500 internal-error. The body carries code INTERNAL_ERROR.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    MALFORMED_REQUEST:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 400 malformed-request. The body carries code MALFORMED_REQUEST.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    METHOD_NOT_ALLOWED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 405 method-not-allowed. The body carries code METHOD_NOT_ALLOWED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    NOT_FOUND:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 404 not-found. The body carries code NOT_FOUND.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    RATE_LIMITED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 429 rate-limited. The body carries code RATE_LIMITED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UNAUTHORIZED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 401 unauthorized. The body carries code UNAUTHORIZED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UNPROCESSABLE:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 422 unprocessable. The body carries code UNPROCESSABLE.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UPSTREAM_TIMEOUT:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 504 upstream-timeout. The body carries code UPSTREAM_TIMEOUT.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UPSTREAM_UNAVAILABLE:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 503 upstream-unavailable. The body carries code UPSTREAM_UNAVAILABLE.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    VALIDATION_FAILED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 400 validation-failed. The body carries code VALIDATION_FAILED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
  schemas:
    AddUserRequest:
      type: object
      description: A person to add to a merchant
      properties:
        email:
          type: string
          format: email
          example: analyst@kauzes.dev
          maxLength: 320
          minLength: 0
        fullName:
          type: string
          example: Alex Kauzes
          maxLength: 200
          minLength: 0
        password:
          type: string
          format: password
          maxLength: 200
          minLength: 12
        roles:
          type: array
          description: At least one. A user with no role could sign in and do nothing.
          items:
            type: string
            enum:
            - OWNER
            - ADMIN
            - ANALYST
            - VIEWER
          minItems: 1
          uniqueItems: true
      required:
      - email
      - fullName
      - password
      - roles
    ApiKeyResponse:
      type: object
      description: An API key. The secret is not here and cannot be retrieved.
      properties:
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        keyId:
          type: string
          description: Sent as X-Mizan-Key
          example: mzk_7Qv3nR2xKp0LmA9d
        lastUsedAt:
          type: string
          format: date-time
          description: "When a request last used it, or null if never"
        name:
          type: string
        revokedAt:
          type: string
          format: date-time
        role:
          type: string
          enum:
          - OWNER
          - ADMIN
          - ANALYST
          - VIEWER
        rotatedFrom:
          type: string
          format: uuid
          description: "The key this one replaced, if it was issued by a rotation"
    FieldViolation:
      description: "One rejected field, in the shape a form can render beside the\
        \ input."
      properties:
        field:
          type: string
          description: The field that was rejected.
        message:
          type: string
          description: Why it was rejected.
      required:
      - field
      - message
    IssueKeyRequest:
      type: object
      description: A key to issue
      properties:
        name:
          type: string
          description: What this key is for
          example: nightly reconciliation
          maxLength: 200
          minLength: 0
        role:
          type: string
          description: "What the key may do. One role: a server integration does one\
            \ job."
          enum:
          - OWNER
          - ADMIN
          - ANALYST
          - VIEWER
      required:
      - name
      - role
    IssuedKeyResponse:
      type: object
      description: "A newly issued key, with its secret. This is the only time the\
        \ secret is returned: it is stored encrypted and no endpoint gives it back.\
        \ Lose it and rotate the key."
      properties:
        key:
          $ref: "#/components/schemas/ApiKeyResponse"
        secret:
          type: string
          description: The signing secret
          example: mzs_...
    MerchantResponse:
      type: object
      description: The account money belongs to
      properties:
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        name:
          type: string
    Problem:
      description: An RFC 9457 problem detail. The body of every failing request.
      example:
        code: VALIDATION_FAILED
        correlationId: 9f1c4e2a7b3d4f10
        detail: The request failed validation.
        errors:
        - field: amount.minorUnits
          message: must be greater than 0
        instance: /api/v1/payments
        status: 400
        timestamp: 2026-08-27T09:15:00Z
        title: validation-failed
        type: https://mizan.kauzes.dev/errors/validation-failed
      properties:
        code:
          type: string
          description: The stable machine readable error. Branch on this.
          enum:
          - VALIDATION_FAILED
          - MALFORMED_REQUEST
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - CONFLICT
          - IDEMPOTENCY_KEY_REUSED
          - UNPROCESSABLE
          - RATE_LIMITED
          - INTERNAL_ERROR
          - UPSTREAM_UNAVAILABLE
          - UPSTREAM_TIMEOUT
        correlationId:
          type: string
          description: "The id this request was handled under, for finding it in the\
            \ logs."
        detail:
          type: string
          description: "What went wrong, when the error was raised deliberately. An\
            \ unexpected failure carries a fixed message and no internals."
        errors:
          type: array
          description: "Present only on a validation failure, one entry per field."
          items:
            $ref: "#/components/schemas/FieldViolation"
        instance:
          type: string
          format: uri
          description: The path of the request that failed.
        status:
          format: int32
          description: "The HTTP status, derived from the code."
        timestamp:
          type: string
          format: date-time
          description: When the error was produced.
        title:
          type: string
          description: The code in readable form.
        type:
          type: string
          format: uri
          description: Identifies the error. It is not required to resolve.
      required:
      - code
      - correlationId
      - status
      - timestamp
      - title
      - type
    RefreshRequest:
      type: object
      description: A refresh token being exchanged for a new pair
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
      - refreshToken
    RegisterMerchantRequest:
      type: object
      description: A new merchant and the owner account created with it
      properties:
        email:
          type: string
          format: email
          description: Email the owner signs in with
          example: owner@kauzes.dev
          maxLength: 320
          minLength: 0
        fullName:
          type: string
          description: Owner's name
          example: Sam Kauzes
          maxLength: 200
          minLength: 0
        merchantName:
          type: string
          description: Trading name of the merchant
          example: Kauzes Coffee
          maxLength: 200
          minLength: 0
        password:
          type: string
          format: password
          description: Owner's password. Stored as a salted hash and never returned.
          maxLength: 200
          minLength: 12
      required:
      - email
      - fullName
      - merchantName
      - password
    RegistrationResponse:
      type: object
      description: A newly registered merchant and its owner
      properties:
        merchant:
          $ref: "#/components/schemas/MerchantResponse"
        owner:
          $ref: "#/components/schemas/UserResponse"
    SetRolesRequest:
      type: object
      description: The complete set of roles a user should hold
      properties:
        roles:
          type: array
          items:
            type: string
            enum:
            - OWNER
            - ADMIN
            - ANALYST
            - VIEWER
          minItems: 1
          uniqueItems: true
      required:
      - roles
    SignInRequest:
      type: object
      description: Credentials exchanged for a token pair
      properties:
        email:
          type: string
          example: owner@kauzes.dev
          minLength: 1
        password:
          type: string
          format: password
          minLength: 1
      required:
      - email
      - password
    TokenPair:
      type: object
      description: An access token and the refresh token that renews it
      properties:
        accessToken:
          type: string
          description: "Send as: Authorization: Bearer <token>"
        expiresIn:
          type: integer
          format: int64
          description: Seconds until the access token expires
        refreshExpiresIn:
          type: integer
          format: int64
          description: Seconds until the refresh token expires
        refreshToken:
          type: string
          description: "Presented once, to the refresh endpoint. Rotates on use."
        tokenType:
          type: string
          example: Bearer
    UserResponse:
      type: object
      description: A person acting for a merchant
      properties:
        createdAt:
          type: string
          format: date-time
        email:
          type: string
        fullName:
          type: string
        id:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
            enum:
            - OWNER
            - ADMIN
            - ANALYST
            - VIEWER
          uniqueItems: true
  securitySchemes:
    merchantApiKey:
      description: "The merchant's API key, naming which key signed the request. Public,\
        \ and not a secret. Issued at POST /api/v1/merchants/{merchantId}/api-keys,\
        \ which returns the signing secret once. Paired with merchantSignature and\
        \ merchantTimestamp; a key on its own is not enough."
      in: header
      name: X-Mizan-Key
      type: apiKey
    merchantJwt:
      bearerFormat: JWT
      description: "A short lived access token issued by identity-service, sent as\
        \ an Authorization bearer header. Obtained from POST /api/v1/tokens and renewed\
        \ at /api/v1/tokens/refresh. The gateway verifies it and passes the established\
        \ identity on; a service never sees the token itself."
      scheme: bearer
      type: http
    merchantSignature:
      description: |-
        HMAC-SHA256 of the canonical request under the key's secret, in lowercase hex.

        The canonical request is four lines joined with a newline: the uppercase method, the path, the value of X-Mizan-Timestamp, and the SHA-256 of the body in lowercase hex, which for a request with no body is the digest of the empty string.

            POST
            /api/v1/payments
            1788100000
            e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855

        Method and path are covered so a captured signature cannot be aimed at another endpoint, the body so it cannot be replayed with different numbers in it, and the timestamp so it cannot be replayed at all.
      in: header
      name: X-Mizan-Signature
      type: apiKey
    merchantTimestamp:
      description: "Unix seconds at which the request was signed. A request whose\
        \ timestamp is further from the platform's clock than the accepted window,\
        \ five minutes by default, is refused whatever its signature says."
      in: header
      name: X-Mizan-Timestamp
      type: apiKey
