openapi: 3.1.0
info:
  description: |-
    Part of the Mizan payments platform. Every service is reached through the gateway under /api/v1.

    Errors are RFC 9457 problem details. The code field is the contract: it comes from a closed set, never changes meaning, and the HTTP status is derived from it. Branch on the code rather than on the status or the message. The responses under components.responses are named after those codes.

    Every request carries a correlation id. Send one in X-Correlation-Id and it is echoed back and printed on every log line the request touches; send none and one is generated at the edge. Quote it when reporting a problem.
  title: identity-service
  version: 0.1.0
servers:
- description: The local gateway. Services are not addressed directly.
  url: http://localhost:8080
tags:
- description: Opening an account and reading who acts for it
  name: Merchants
paths:
  /api/v1/merchants:
    post:
      description: Creates the merchant and the owner account together. Either both
        exist afterwards or neither does.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterMerchantRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
          description: The merchant and its owner
        "400":
          $ref: "#/components/responses/VALIDATION_FAILED"
        "409":
          $ref: "#/components/responses/CONFLICT"
      summary: Register a merchant
      tags:
      - Merchants
  /api/v1/merchants/{merchantId}:
    get:
      operationId: find
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantResponse"
          description: The merchant
        "404":
          $ref: "#/components/responses/NOT_FOUND"
      summary: Read a merchant
      tags:
      - Merchants
  /api/v1/merchants/{merchantId}/users:
    get:
      description: Oldest first. No password or hash appears in this response.
      operationId: users
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
          description: The merchant's users
        "404":
          $ref: "#/components/responses/NOT_FOUND"
      summary: List the users of a merchant
      tags:
      - Merchants
components:
  headers:
    X-Correlation-Id:
      description: "The correlation id this request was handled under. Echoed from\
        \ the request when it sent one, generated at the edge otherwise."
      schema:
        type: string
  responses:
    CONFLICT:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 409 conflict. The body carries code CONFLICT.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    FORBIDDEN:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 403 forbidden. The body carries code FORBIDDEN.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    IDEMPOTENCY_KEY_REUSED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 409 idempotency-key-reused. The body carries code IDEMPOTENCY_KEY_REUSED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    INTERNAL_ERROR:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 500 internal-error. The body carries code INTERNAL_ERROR.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    MALFORMED_REQUEST:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 400 malformed-request. The body carries code MALFORMED_REQUEST.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    METHOD_NOT_ALLOWED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 405 method-not-allowed. The body carries code METHOD_NOT_ALLOWED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    NOT_FOUND:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 404 not-found. The body carries code NOT_FOUND.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    RATE_LIMITED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 429 rate-limited. The body carries code RATE_LIMITED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UNAUTHORIZED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 401 unauthorized. The body carries code UNAUTHORIZED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UNPROCESSABLE:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 422 unprocessable. The body carries code UNPROCESSABLE.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UPSTREAM_TIMEOUT:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 504 upstream-timeout. The body carries code UPSTREAM_TIMEOUT.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UPSTREAM_UNAVAILABLE:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 503 upstream-unavailable. The body carries code UPSTREAM_UNAVAILABLE.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    VALIDATION_FAILED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 400 validation-failed. The body carries code VALIDATION_FAILED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
  schemas:
    FieldViolation:
      description: "One rejected field, in the shape a form can render beside the\
        \ input."
      properties:
        field:
          type: string
          description: The field that was rejected.
        message:
          type: string
          description: Why it was rejected.
      required:
      - field
      - message
    MerchantResponse:
      type: object
      description: The account money belongs to
      properties:
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        name:
          type: string
    Problem:
      description: An RFC 9457 problem detail. The body of every failing request.
      example:
        code: VALIDATION_FAILED
        correlationId: 9f1c4e2a7b3d4f10
        detail: The request failed validation.
        errors:
        - field: amount.minorUnits
          message: must be greater than 0
        instance: /api/v1/payments
        status: 400
        timestamp: 2026-08-27T09:15:00Z
        title: validation-failed
        type: https://mizan.kauzes.dev/errors/validation-failed
      properties:
        code:
          type: string
          description: The stable machine readable error. Branch on this.
          enum:
          - VALIDATION_FAILED
          - MALFORMED_REQUEST
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - CONFLICT
          - IDEMPOTENCY_KEY_REUSED
          - UNPROCESSABLE
          - RATE_LIMITED
          - INTERNAL_ERROR
          - UPSTREAM_UNAVAILABLE
          - UPSTREAM_TIMEOUT
        correlationId:
          type: string
          description: "The id this request was handled under, for finding it in the\
            \ logs."
        detail:
          type: string
          description: "What went wrong, when the error was raised deliberately. An\
            \ unexpected failure carries a fixed message and no internals."
        errors:
          type: array
          description: "Present only on a validation failure, one entry per field."
          items:
            $ref: "#/components/schemas/FieldViolation"
        instance:
          type: string
          format: uri
          description: The path of the request that failed.
        status:
          format: int32
          description: "The HTTP status, derived from the code."
        timestamp:
          type: string
          format: date-time
          description: When the error was produced.
        title:
          type: string
          description: The code in readable form.
        type:
          type: string
          format: uri
          description: Identifies the error. It is not required to resolve.
      required:
      - code
      - correlationId
      - status
      - timestamp
      - title
      - type
    RegisterMerchantRequest:
      type: object
      description: A new merchant and the owner account created with it
      properties:
        email:
          type: string
          format: email
          description: Email the owner signs in with
          example: owner@kauzes.dev
          maxLength: 320
          minLength: 0
        fullName:
          type: string
          description: Owner's name
          example: Sam Kauzes
          maxLength: 200
          minLength: 0
        merchantName:
          type: string
          description: Trading name of the merchant
          example: Kauzes Coffee
          maxLength: 200
          minLength: 0
        password:
          type: string
          format: password
          description: Owner's password. Stored as a salted hash and never returned.
          maxLength: 200
          minLength: 12
      required:
      - email
      - fullName
      - merchantName
      - password
    RegistrationResponse:
      type: object
      description: A newly registered merchant and its owner
      properties:
        merchant:
          $ref: "#/components/schemas/MerchantResponse"
        owner:
          $ref: "#/components/schemas/UserResponse"
    UserResponse:
      type: object
      description: A person acting for a merchant
      properties:
        createdAt:
          type: string
          format: date-time
        email:
          type: string
        fullName:
          type: string
        id:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
            enum:
            - OWNER
            - ADMIN
            - ANALYST
            - VIEWER
          uniqueItems: true
  securitySchemes:
    merchantApiKey:
      description: "The merchant's API key, identifying which merchant a server to\
        \ server call belongs to. Paired with merchantSignature; a key on its own\
        \ is not enough. Not enforced until MIZ-2."
      in: header
      name: X-Mizan-Key
      type: apiKey
    merchantJwt:
      bearerFormat: JWT
      description: "A short lived access token issued by identity-service, sent as\
        \ an Authorization bearer header. Used by a person signed in to the merchant\
        \ console. Not enforced until MIZ-2."
      scheme: bearer
      type: http
    merchantSignature:
      description: "An HMAC signature over the request, proving the caller holds the\
        \ secret behind the API key. What exactly is signed is settled by MIZ-2. Not\
        \ enforced until then."
      in: header
      name: X-Mizan-Signature
      type: apiKey
