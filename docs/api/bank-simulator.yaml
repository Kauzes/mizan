openapi: 3.1.0
info:
  description: |-
    Part of the Mizan payments platform. Every service is reached through the gateway under /api/v1.

    Errors are RFC 9457 problem details. The code field is the contract: it comes from a closed set, never changes meaning, and the HTTP status is derived from it. Branch on the code rather than on the status or the message. The responses under components.responses are named after those codes.

    Every request carries a correlation id. Send one in X-Correlation-Id and it is echoed back and printed on every log line the request touches; send none and one is generated at the edge. Quote it when reporting a problem.
  title: bank-simulator
  version: 0.1.0
servers:
- description: The local gateway. Services are not addressed directly.
  url: http://localhost:8080
tags:
- description: "A bank, for the purposes of not needing one"
  name: Acquirer
paths:
  /acquirer/authorizations:
    get:
      description: |-
        Looked up by the requestId the caller chose, not by the acquirer's own reference, because a caller whose answer was lost never learned the reference.

        This is what turns a timeout from a guess into a question.
      operationId: lookUp
      parameters:
      - in: query
        name: requestId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationResponse"
          description: What was decided
        "404":
          $ref: "#/components/responses/NOT_FOUND"
      summary: Ask what happened to a request
      tags:
      - Acquirer
    post:
      description: |-
        Reserves the money, or refuses. What this acquirer does is decided by the last four digits of the card, so a caller can provoke any outcome without knowing it is talking to a simulator:

        - `0000`, or anything not listed: approved
        - `0002`: declined, insufficient_funds
        - `0005`: declined, do_not_honour
        - `0007`: declined, stolen_card
        - `0069`: approved, but the answer takes longer than the caller will wait
        - `0068`: declined, but likewise. A caller who gave up cannot tell this                     apart from `0069`, which is why resolving a timeout means asking rather                     than assuming

        Sending the same requestId again returns the first decision rather than authorizing a second time, which is what a real acquirer does and what makes a lost answer safe to ask about again.
      operationId: authorize
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationResponse"
          description: What the acquirer decided
        "400":
          $ref: "#/components/responses/VALIDATION_FAILED"
      summary: Authorize an amount
      tags:
      - Acquirer
  /acquirer/authorizations/{acquirerReference}/capture:
    post:
      operationId: capture
      parameters:
      - in: path
        name: acquirerReference
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationResponse"
          description: "The authorization, now captured"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
        "422":
          $ref: "#/components/responses/UNPROCESSABLE"
      summary: Take an authorized amount
      tags:
      - Acquirer
  /acquirer/authorizations/{acquirerReference}/refund:
    post:
      description: |-
        In full or in part, and more than once, until nothing is left unrefunded.                     Only money that was actually taken can be given back: refunding something                     that was voided or refused is refused.

        Idempotent on the caller's own reference. Sending the same one again                     returns what the first call gave back rather than giving it back twice.
      operationId: refund
      parameters:
      - in: path
        name: acquirerReference
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundResponse"
          description: What was given back
        "400":
          $ref: "#/components/responses/VALIDATION_FAILED"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
        "422":
          $ref: "#/components/responses/UNPROCESSABLE"
      summary: Give back money that was taken
      tags:
      - Acquirer
  /acquirer/authorizations/{acquirerReference}/void:
    post:
      operationId: voidAuthorization
      parameters:
      - in: path
        name: acquirerReference
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationResponse"
          description: "The authorization, now voided"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
        "422":
          $ref: "#/components/responses/UNPROCESSABLE"
      summary: Release an authorized amount without taking it
      tags:
      - Acquirer
components:
  headers:
    X-Correlation-Id:
      description: "The correlation id this request was handled under. Echoed from\
        \ the request when it sent one, generated at the edge otherwise."
      schema:
        type: string
  responses:
    CONFLICT:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 409 conflict. The body carries code CONFLICT.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    CONTENDED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 409 contended. The body carries code CONTENDED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    FORBIDDEN:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 403 forbidden. The body carries code FORBIDDEN.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    IDEMPOTENCY_KEY_REUSED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 409 idempotency-key-reused. The body carries code IDEMPOTENCY_KEY_REUSED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    INTERNAL_ERROR:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 500 internal-error. The body carries code INTERNAL_ERROR.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    MALFORMED_REQUEST:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 400 malformed-request. The body carries code MALFORMED_REQUEST.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    METHOD_NOT_ALLOWED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 405 method-not-allowed. The body carries code METHOD_NOT_ALLOWED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    NOT_FOUND:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 404 not-found. The body carries code NOT_FOUND.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    RATE_LIMITED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 429 rate-limited. The body carries code RATE_LIMITED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UNAUTHORIZED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 401 unauthorized. The body carries code UNAUTHORIZED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UNPROCESSABLE:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 422 unprocessable. The body carries code UNPROCESSABLE.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UPSTREAM_TIMEOUT:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 504 upstream-timeout. The body carries code UPSTREAM_TIMEOUT.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UPSTREAM_UNAVAILABLE:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 503 upstream-unavailable. The body carries code UPSTREAM_UNAVAILABLE.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    VALIDATION_FAILED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 400 validation-failed. The body carries code VALIDATION_FAILED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
  schemas:
    AuthorizationResponse:
      type: object
      description: What the acquirer decided
      properties:
        acquirerReference:
          type: string
          description: The acquirer's own reference. Captures and voids name this.
          example: auth_7Qv3nR2xKp0L
        amount:
          type: integer
          format: int64
        cardLastFour:
          type: string
          description: "The last four digits of the card, which is all that is kept"
        currency:
          type: string
        decidedAt:
          type: string
          format: date-time
        outcome:
          type: string
          enum:
          - APPROVED
          - DECLINED
        reason:
          type: string
          description: "Why it was refused, or null if it was not"
        requestId:
          type: string
        state:
          type: string
          description: Whether the money has since been taken or released
          enum:
          - HELD
          - CAPTURED
          - VOIDED
          - REFUSED
    AuthorizeRequest:
      type: object
      description: An authorization to attempt
      properties:
        amount:
          type: integer
          format: int64
          description: Minor units
          example: 125000
          minimum: 0
        card:
          type: string
          description: The last four digits decide what this acquirer does. See the
            description of this operation.
          example: "4000000000000000"
          minLength: 1
          pattern: "[0-9]{12,19}"
        currency:
          type: string
          example: TRY
          minLength: 1
          pattern: "[A-Z]{3}"
        requestId:
          type: string
          description: The caller's own identifier for this attempt. Sending it again
            returns the first outcome rather than authorizing twice.
          example: payment-8f21c0d4-attempt-1
          maxLength: 200
          minLength: 0
      required:
      - card
      - currency
      - requestId
    FieldViolation:
      description: "One rejected field, in the shape a form can render beside the\
        \ input."
      properties:
        field:
          type: string
          description: The field that was rejected.
        message:
          type: string
          description: Why it was rejected.
      required:
      - field
      - message
    Problem:
      description: An RFC 9457 problem detail. The body of every failing request.
      example:
        code: VALIDATION_FAILED
        correlationId: 9f1c4e2a7b3d4f10
        detail: The request failed validation.
        errors:
        - field: amount.minorUnits
          message: must be greater than 0
        instance: /api/v1/payments
        status: 400
        timestamp: 2026-08-27T09:15:00Z
        title: validation-failed
        type: https://mizan.kauzes.dev/errors/validation-failed
      properties:
        code:
          type: string
          description: The stable machine readable error. Branch on this.
          enum:
          - VALIDATION_FAILED
          - MALFORMED_REQUEST
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - CONFLICT
          - IDEMPOTENCY_KEY_REUSED
          - CONTENDED
          - UNPROCESSABLE
          - RATE_LIMITED
          - INTERNAL_ERROR
          - UPSTREAM_UNAVAILABLE
          - UPSTREAM_TIMEOUT
        correlationId:
          type: string
          description: "The id this request was handled under, for finding it in the\
            \ logs."
        detail:
          type: string
          description: "What went wrong, when the error was raised deliberately. An\
            \ unexpected failure carries a fixed message and no internals."
        errors:
          type: array
          description: "Present only on a validation failure, one entry per field."
          items:
            $ref: "#/components/schemas/FieldViolation"
        instance:
          type: string
          format: uri
          description: The path of the request that failed.
        status:
          format: int32
          description: "The HTTP status, derived from the code."
        timestamp:
          type: string
          format: date-time
          description: When the error was produced.
        title:
          type: string
          description: The code in readable form.
        type:
          type: string
          format: uri
          description: Identifies the error. It is not required to resolve.
      required:
      - code
      - correlationId
      - status
      - timestamp
      - title
      - type
    RefundRequest:
      type: object
      description: Money to give back
      properties:
        amount:
          type: integer
          format: int64
          description: "Minor units, at most what is left unrefunded"
          example: 25000
          minimum: 0
        reference:
          type: string
          description: The caller's own identifier for this refund. Sending it again
            returns the first result rather than refunding twice.
          example: payment-8f21c0d4-refund-1
          maxLength: 200
          minLength: 0
      required:
      - reference
    RefundResponse:
      type: object
      description: Money given back
      properties:
        acquirerReference:
          type: string
          example: rfnd_2Bk9xQ1mLp4T
        amount:
          type: integer
          format: int64
          description: What this refund gave back
        authorizationReference:
          type: string
          description: The authorization this was refunded against
        currency:
          type: string
        reference:
          type: string
          description: "The caller's own identifier, echoed"
        refundedAt:
          type: string
          format: date-time
        refundedInTotal:
          type: integer
          format: int64
          description: "What has been given back in total, including this"
        remaining:
          type: integer
          format: int64
          description: What is left that could still be refunded
  securitySchemes:
    merchantApiKey:
      description: "The merchant's API key, naming which key signed the request. Public,\
        \ and not a secret. Issued at POST /api/v1/merchants/{merchantId}/api-keys,\
        \ which returns the signing secret once. Paired with merchantSignature and\
        \ merchantTimestamp; a key on its own is not enough."
      in: header
      name: X-Mizan-Key
      type: apiKey
    merchantJwt:
      bearerFormat: JWT
      description: "A short lived access token issued by identity-service, sent as\
        \ an Authorization bearer header. Obtained from POST /api/v1/tokens and renewed\
        \ at /api/v1/tokens/refresh. The gateway verifies it and passes the established\
        \ identity on; a service never sees the token itself."
      scheme: bearer
      type: http
    merchantSignature:
      description: |-
        HMAC-SHA256 of the canonical request under the key's secret, in lowercase hex.

        The canonical request is four lines joined with a newline: the uppercase method, the path, the value of X-Mizan-Timestamp, and the SHA-256 of the body in lowercase hex, which for a request with no body is the digest of the empty string.

            POST
            /api/v1/payments
            1788100000
            e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855

        Method and path are covered so a captured signature cannot be aimed at another endpoint, the body so it cannot be replayed with different numbers in it, and the timestamp so it cannot be replayed at all.
      in: header
      name: X-Mizan-Signature
      type: apiKey
    merchantTimestamp:
      description: "Unix seconds at which the request was signed. A request whose\
        \ timestamp is further from the platform's clock than the accepted window,\
        \ five minutes by default, is refused whatever its signature says."
      in: header
      name: X-Mizan-Timestamp
      type: apiKey
