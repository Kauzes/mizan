openapi: 3.1.0
info:
  description: |-
    Part of the Mizan payments platform. Every service is reached through the gateway under /api/v1.

    Errors are RFC 9457 problem details. The code field is the contract: it comes from a closed set, never changes meaning, and the HTTP status is derived from it. Branch on the code rather than on the status or the message. The responses under components.responses are named after those codes.

    Every request carries a correlation id. Send one in X-Correlation-Id and it is echoed back and printed on every log line the request touches; send none and one is generated at the edge. Quote it when reporting a problem.
  title: ledger-service
  version: 0.1.0
servers:
- description: The local gateway. Services are not addressed directly.
  url: http://localhost:8080
tags:
- description: "Movements of money, as entries that sum to zero"
  name: Journal
- description: The chart of accounts a merchant's money moves through
  name: Accounts
paths:
  /api/v1/merchants/{merchantId}/accounts:
    get:
      description: |-
        Ordered by code.

        Requires the ACCOUNT_READ permission, held by: OWNER, ADMIN, ANALYST, VIEWER. The caller must be acting for the merchant in the path.
      operationId: list_1
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountResponse"
          description: The merchant's accounts
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
      security:
      - merchantJwt: []
      summary: List a merchant's accounts
      tags:
      - Accounts
    post:
      description: |-
        The type decides which way a posting moves this account, and the currency is fixed for its life. Neither can be changed afterwards, because either would reinterpret history already written against it.

        Requires the ACCOUNT_MANAGE permission, held by: OWNER, ADMIN. The caller must be acting for the merchant in the path.
      operationId: open
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenAccountRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
          description: The account that was opened
        "400":
          $ref: "#/components/responses/VALIDATION_FAILED"
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "409":
          $ref: "#/components/responses/CONFLICT"
        "422":
          $ref: "#/components/responses/UNPROCESSABLE"
      security:
      - merchantJwt: []
      summary: Open an account
      tags:
      - Accounts
  /api/v1/merchants/{merchantId}/accounts/{accountId}:
    get:
      description: "Requires the ACCOUNT_READ permission, held by: OWNER, ADMIN, ANALYST,\
        \ VIEWER. The caller must be acting for the merchant in the path."
      operationId: find_1
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: accountId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
          description: The account
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
      security:
      - merchantJwt: []
      summary: Read an account
      tags:
      - Accounts
  /api/v1/merchants/{merchantId}/accounts/{accountId}/balance:
    get:
      description: |-
        Read from the account rather than summed from its history, so it costs the same whatever the account has been through. The number is the signed sum of the account's postings, debit positive, and is true as at the moment given.

        Requires the ACCOUNT_READ permission, held by: OWNER, ADMIN, ANALYST, VIEWER. The caller must be acting for the merchant in the path.
      operationId: balance
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: accountId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
          description: What the account holds
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
      security:
      - merchantJwt: []
      summary: Read an account's balance
      tags:
      - Accounts
  /api/v1/merchants/{merchantId}/entries:
    get:
      description: |-
        Most recent movement first.

        Requires the ENTRY_READ permission, held by: OWNER, ADMIN, ANALYST, VIEWER. The caller must be acting for the merchant in the path.
      operationId: list
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntryResponse"
          description: The merchant's entries
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
      security:
      - merchantJwt: []
      summary: List a merchant's entries
      tags:
      - Journal
    post:
      description: |-
        The postings must sum to zero within each currency they touch. A positive amount is a debit; whether that increases the account is decided by the account's type. Nothing posted here can be changed afterwards.

        The call is idempotent on externalReference: sending the same reference again returns the entry the first call wrote, with the same id and the same status, so a retry after a dropped response is safe. The same reference sent with different postings is refused.

        Requires the ENTRY_POST permission, held by: OWNER, ADMIN. The caller must be acting for the merchant in the path.
      operationId: post
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostEntryRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryResponse"
          description: "The entry as written, or the one an earlier call with this\
            \ reference wrote"
        "400":
          $ref: "#/components/responses/VALIDATION_FAILED"
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "409":
          $ref: "#/components/responses/CONFLICT"
        "422":
          $ref: "#/components/responses/UNPROCESSABLE"
      security:
      - merchantJwt: []
      summary: Post an entry
      tags:
      - Journal
  /api/v1/merchants/{merchantId}/entries/{entryId}:
    get:
      description: "Requires the ENTRY_READ permission, held by: OWNER, ADMIN, ANALYST,\
        \ VIEWER. The caller must be acting for the merchant in the path."
      operationId: find
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: entryId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryResponse"
          description: The entry
        "401":
          $ref: "#/components/responses/UNAUTHORIZED"
        "403":
          $ref: "#/components/responses/FORBIDDEN"
        "404":
          $ref: "#/components/responses/NOT_FOUND"
      security:
      - merchantJwt: []
      summary: Read an entry and its postings
      tags:
      - Journal
components:
  headers:
    X-Correlation-Id:
      description: "The correlation id this request was handled under. Echoed from\
        \ the request when it sent one, generated at the edge otherwise."
      schema:
        type: string
  responses:
    CONFLICT:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 409 conflict. The body carries code CONFLICT.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    CONTENDED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 409 contended. The body carries code CONTENDED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    FORBIDDEN:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 403 forbidden. The body carries code FORBIDDEN.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    IDEMPOTENCY_KEY_REUSED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 409 idempotency-key-reused. The body carries code IDEMPOTENCY_KEY_REUSED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    INTERNAL_ERROR:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 500 internal-error. The body carries code INTERNAL_ERROR.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    MALFORMED_REQUEST:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 400 malformed-request. The body carries code MALFORMED_REQUEST.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    METHOD_NOT_ALLOWED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 405 method-not-allowed. The body carries code METHOD_NOT_ALLOWED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    NOT_FOUND:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 404 not-found. The body carries code NOT_FOUND.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    RATE_LIMITED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 429 rate-limited. The body carries code RATE_LIMITED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UNAUTHORIZED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 401 unauthorized. The body carries code UNAUTHORIZED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UNPROCESSABLE:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 422 unprocessable. The body carries code UNPROCESSABLE.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UPSTREAM_TIMEOUT:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 504 upstream-timeout. The body carries code UPSTREAM_TIMEOUT.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    UPSTREAM_UNAVAILABLE:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 503 upstream-unavailable. The body carries code UPSTREAM_UNAVAILABLE.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
    VALIDATION_FAILED:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      description: 400 validation-failed. The body carries code VALIDATION_FAILED.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
  schemas:
    AccountResponse:
      type: object
      description: An account in the books
      properties:
        balance:
          type: integer
          format: int64
          description: "The signed sum of this account's postings, debit positive,\
            \ in minor units. Not flipped to read naturally for a liability: the type\
            \ says which way to read it."
          example: 125000
        code:
          type: string
        createdAt:
          type: string
          format: date-time
        currency:
          type: string
        id:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        name:
          type: string
        normalSide:
          type: string
          description: "Which side increases this account, from its type"
          example: DEBIT
        type:
          type: string
          enum:
          - ASSET
          - LIABILITY
          - EQUITY
          - REVENUE
          - EXPENSE
    BalanceResponse:
      type: object
      description: "What an account holds, as at the moment it was read"
      properties:
        accountId:
          type: string
          format: uuid
        balance:
          type: integer
          format: int64
          description: "The signed sum of the account's postings, debit positive,\
            \ in minor units"
          example: 125000
        code:
          type: string
        currency:
          type: string
        normalSide:
          type: string
          example: DEBIT
        readAt:
          type: string
          format: date-time
          description: When this was read. A balance is only ever true as at a moment.
        type:
          type: string
          enum:
          - ASSET
          - LIABILITY
          - EQUITY
          - REVENUE
          - EXPENSE
    EntryResponse:
      type: object
      description: "A movement of money, as written"
      properties:
        corrects:
          type: string
          format: uuid
        description:
          type: string
        externalReference:
          type: string
        id:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        postings:
          type: array
          items:
            $ref: "#/components/schemas/PostingResponse"
        recordedAt:
          type: string
          format: date-time
          description: "When this was written, which is not when the money moved"
    FieldViolation:
      description: "One rejected field, in the shape a form can render beside the\
        \ input."
      properties:
        field:
          type: string
          description: The field that was rejected.
        message:
          type: string
          description: Why it was rejected.
      required:
      - field
      - message
    OpenAccountRequest:
      type: object
      description: An account to open
      properties:
        code:
          type: string
          description: "How this account is referred to. Unique within the merchant,\
            \ and not changeable afterwards."
          example: settlement.try
          maxLength: 64
          minLength: 0
          pattern: "[a-z][a-z0-9._-]*"
        currency:
          type: string
          description: ISO 4217. Fixed for the life of the account.
          example: TRY
          minLength: 1
          pattern: "[A-Z]{3}"
        name:
          type: string
          description: "What it is, for a person reading a report"
          example: "Settlement account, TRY"
          maxLength: 200
          minLength: 0
        type:
          type: string
          description: Decides which way a posting moves this account
          enum:
          - ASSET
          - LIABILITY
          - EQUITY
          - REVENUE
          - EXPENSE
      required:
      - code
      - currency
      - name
      - type
    PostEntryRequest:
      type: object
      description: "A movement of money, as postings that sum to zero"
      properties:
        corrects:
          type: string
          format: uuid
          description: "The entry this one corrects, if it is a correction"
        description:
          type: string
          example: Card payment captured
          maxLength: 500
          minLength: 0
        externalReference:
          type: string
          description: "What the caller calls this movement. Sending it twice yields\
            \ one entry, and the second call is answered with the first one's result,\
            \ so a retry after a dropped response is safe. Unique within the merchant."
          example: payment:8f21c0d4-capture
          maxLength: 200
          minLength: 0
        occurredAt:
          type: string
          format: date-time
          description: "When the money moved, which need not be now"
        postings:
          type: array
          description: "At least two, summing to zero within each currency"
          items:
            $ref: "#/components/schemas/PostingRequest"
          maxItems: 2147483647
          minItems: 2
      required:
      - description
      - externalReference
      - occurredAt
      - postings
    PostingRequest:
      type: object
      description: One side of a movement
      properties:
        accountId:
          type: string
          format: uuid
          description: The account this side moves
        amount:
          type: integer
          format: int64
          description: "Signed minor units, in the account's currency. Positive is\
            \ a debit, negative is a credit, and zero says nothing. Whether a debit\
            \ increases this account is decided by its type."
          example: 125000
      required:
      - accountId
    PostingResponse:
      type: object
      description: "One side of a movement, as written"
      properties:
        accountCode:
          type: string
        accountId:
          type: string
          format: uuid
        amount:
          type: integer
          format: int64
        currency:
          type: string
        direction:
          type: string
          example: DEBIT
        id:
          type: string
          format: uuid
    Problem:
      description: An RFC 9457 problem detail. The body of every failing request.
      example:
        code: VALIDATION_FAILED
        correlationId: 9f1c4e2a7b3d4f10
        detail: The request failed validation.
        errors:
        - field: amount.minorUnits
          message: must be greater than 0
        instance: /api/v1/payments
        status: 400
        timestamp: 2026-08-27T09:15:00Z
        title: validation-failed
        type: https://mizan.kauzes.dev/errors/validation-failed
      properties:
        code:
          type: string
          description: The stable machine readable error. Branch on this.
          enum:
          - VALIDATION_FAILED
          - MALFORMED_REQUEST
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - CONFLICT
          - IDEMPOTENCY_KEY_REUSED
          - CONTENDED
          - UNPROCESSABLE
          - RATE_LIMITED
          - INTERNAL_ERROR
          - UPSTREAM_UNAVAILABLE
          - UPSTREAM_TIMEOUT
        correlationId:
          type: string
          description: "The id this request was handled under, for finding it in the\
            \ logs."
        detail:
          type: string
          description: "What went wrong, when the error was raised deliberately. An\
            \ unexpected failure carries a fixed message and no internals."
        errors:
          type: array
          description: "Present only on a validation failure, one entry per field."
          items:
            $ref: "#/components/schemas/FieldViolation"
        instance:
          type: string
          format: uri
          description: The path of the request that failed.
        status:
          format: int32
          description: "The HTTP status, derived from the code."
        timestamp:
          type: string
          format: date-time
          description: When the error was produced.
        title:
          type: string
          description: The code in readable form.
        type:
          type: string
          format: uri
          description: Identifies the error. It is not required to resolve.
      required:
      - code
      - correlationId
      - status
      - timestamp
      - title
      - type
  securitySchemes:
    merchantApiKey:
      description: "The merchant's API key, naming which key signed the request. Public,\
        \ and not a secret. Issued at POST /api/v1/merchants/{merchantId}/api-keys,\
        \ which returns the signing secret once. Paired with merchantSignature and\
        \ merchantTimestamp; a key on its own is not enough."
      in: header
      name: X-Mizan-Key
      type: apiKey
    merchantJwt:
      bearerFormat: JWT
      description: "A short lived access token issued by identity-service, sent as\
        \ an Authorization bearer header. Obtained from POST /api/v1/tokens and renewed\
        \ at /api/v1/tokens/refresh. The gateway verifies it and passes the established\
        \ identity on; a service never sees the token itself."
      scheme: bearer
      type: http
    merchantSignature:
      description: |-
        HMAC-SHA256 of the canonical request under the key's secret, in lowercase hex.

        The canonical request is four lines joined with a newline: the uppercase method, the path, the value of X-Mizan-Timestamp, and the SHA-256 of the body in lowercase hex, which for a request with no body is the digest of the empty string.

            POST
            /api/v1/payments
            1788100000
            e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855

        Method and path are covered so a captured signature cannot be aimed at another endpoint, the body so it cannot be replayed with different numbers in it, and the timestamp so it cannot be replayed at all.
      in: header
      name: X-Mizan-Signature
      type: apiKey
    merchantTimestamp:
      description: "Unix seconds at which the request was signed. A request whose\
        \ timestamp is further from the platform's clock than the accepted window,\
        \ five minutes by default, is refused whatever its signature says."
      in: header
      name: X-Mizan-Timestamp
      type: apiKey
