name: mizan

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mizan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mizan}
      POSTGRES_DB: ${POSTGRES_DB:-mizan}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/local/init-databases.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mizan} -d ${POSTGRES_DB:-mizan}"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: ${KAFKA_IMAGE}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "29092:29092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE}
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    build:
      context: .
      args:
        MODULE: gateway
    environment:
      MIZAN_JWK_SET_URI: http://identity-service:8081/.well-known/jwks.json
      MIZAN_API_KEY_VERIFICATION_URI: http://identity-service:8081/internal/api-keys/verify
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  identity-service:
    build:
      context: .
      args:
        MODULE: identity-service
    environment:
      MIZAN_DB_URL: jdbc:postgresql://postgres:5432/identity
      # Base64 of "mizan-local-development-only-key", which is what it is. A deployment sets
      # this from wherever it keeps secrets; the local stack pins it so that keys issued
      # before a restart still verify after one.
      MIZAN_API_KEY_ENCRYPTION_KEY: bWl6YW4tbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1rZXk=
      MIZAN_DB_USERNAME: ${POSTGRES_USER:-mizan}
      MIZAN_DB_PASSWORD: ${POSTGRES_PASSWORD:-mizan}
    depends_on:
      # Flyway runs on startup, so a service that comes up before Postgres is ready is a
      # service that fails to come up at all.
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  ledger-service:
    build:
      context: .
      args:
        MODULE: ledger-service
    environment:
      MIZAN_DB_URL: jdbc:postgresql://postgres:5432/ledger
      MIZAN_DB_USERNAME: ${POSTGRES_USER:-mizan}
      MIZAN_DB_PASSWORD: ${POSTGRES_PASSWORD:-mizan}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  payment-service:
    build:
      context: .
      args:
        MODULE: payment-service
    environment:
      MIZAN_DB_URL: jdbc:postgresql://postgres:5432/payment
      MIZAN_DB_USERNAME: ${POSTGRES_USER:-mizan}
      MIZAN_DB_PASSWORD: ${POSTGRES_PASSWORD:-mizan}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  risk-service:
    build:
      context: .
      args:
        MODULE: risk-service
    environment:
      MIZAN_DB_URL: jdbc:postgresql://postgres:5432/risk
      MIZAN_DB_USERNAME: ${POSTGRES_USER:-mizan}
      MIZAN_DB_PASSWORD: ${POSTGRES_PASSWORD:-mizan}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  notification-service:
    build:
      context: .
      args:
        MODULE: notification-service
    environment:
      MIZAN_DB_URL: jdbc:postgresql://postgres:5432/notification
      MIZAN_DB_USERNAME: ${POSTGRES_USER:-mizan}
      MIZAN_DB_PASSWORD: ${POSTGRES_PASSWORD:-mizan}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  bank-simulator:
    build:
      context: .
      args:
        MODULE: bank-simulator
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  pgdata:
  kafkadata:
  redisdata:
