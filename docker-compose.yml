name: mizan

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mizan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mizan}
      POSTGRES_DB: ${POSTGRES_DB:-mizan}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/local/init-databases.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mizan} -d ${POSTGRES_DB:-mizan}"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: ${KAFKA_IMAGE}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "29092:29092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE}
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    build:
      context: .
      args:
        MODULE: gateway
    environment:
      # Where this service sends its spans. The collector decides what is kept;
      # this one exports all of them.
      MIZAN_OTLP: http://otel-collector:4318/v1/traces
      # Readable by default, because the usual reader of these is a person watching a
      # terminal. Set to ecs for the JSON a log store can query, which is what CI runs
      # with and what a deployment sets.
      MIZAN_LOG_FORMAT: ${MIZAN_LOG_FORMAT:-}
      MIZAN_JWK_SET_URI: http://identity-service:8081/.well-known/jwks.json
      MIZAN_API_KEY_VERIFICATION_URI: http://identity-service:8081/internal/api-keys/verify
      # Each merchant's rate limit (ADR 0053). Deliberately not in depends_on: a gateway that
      # cannot reach Redis routes everything unlimited, so Redis starting late costs nothing.
      MIZAN_REDIS_HOST: redis
    ports:
      - "8080:8080"
    # Longer than the 20s each service gives its in-flight work (HowThisPlatformStops). Compose's
    # default is 10s, which would kill a service still finishing a request on a plain docker stop.
    stop_grace_period: 30s
    healthcheck:
      # No curl in a distroless image, so the JVM already in it asks instead. The flags keep a
      # probe that runs every ten seconds from costing more than the work it is checking.
      test: ["CMD", "java", "-XX:TieredStopAtLevel=1", "-XX:+UseSerialGC", "-Xmx16m",
             "-cp", "/healthcheck", "Healthcheck", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  identity-service:
    build:
      context: .
      args:
        MODULE: identity-service
    environment:
      # Where this service sends its spans. The collector decides what is kept;
      # this one exports all of them.
      MIZAN_OTLP: http://otel-collector:4318/v1/traces
      # Readable by default, because the usual reader of these is a person watching a
      # terminal. Set to ecs for the JSON a log store can query, which is what CI runs
      # with and what a deployment sets.
      MIZAN_LOG_FORMAT: ${MIZAN_LOG_FORMAT:-}
      MIZAN_DB_URL: jdbc:postgresql://postgres:5432/identity
      # This stack speaks plain HTTP, and a Secure cookie is never sent over it — so the
      # console's session would not survive a reload locally. Off here and nowhere else:
      # a session cookie crossing a real network unencrypted is what the flag exists for.
      MIZAN_SECURITY_SESSION_COOKIE_SECURE: "false"
      # Base64 of "mizan-local-development-only-key", which is what it is. A deployment sets
      # this from wherever it keeps secrets; the local stack pins it so that keys issued
      # before a restart still verify after one.
      MIZAN_API_KEY_ENCRYPTION_KEY: bWl6YW4tbG9jYWwtZGV2ZWxvcG1lbnQtb25seS1rZXk=
      MIZAN_DB_USERNAME: ${POSTGRES_USER:-mizan}
      MIZAN_DB_PASSWORD: ${POSTGRES_PASSWORD:-mizan}
    depends_on:
      # Flyway runs on startup, so a service that comes up before Postgres is ready is a
      # service that fails to come up at all.
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    # Longer than the 20s each service gives its in-flight work (HowThisPlatformStops). Compose's
    # default is 10s, which would kill a service still finishing a request on a plain docker stop.
    stop_grace_period: 30s
    healthcheck:
      # No curl in a distroless image, so the JVM already in it asks instead. The flags keep a
      # probe that runs every ten seconds from costing more than the work it is checking.
      test: ["CMD", "java", "-XX:TieredStopAtLevel=1", "-XX:+UseSerialGC", "-Xmx16m",
             "-cp", "/healthcheck", "Healthcheck", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  ledger-service:
    build:
      context: .
      args:
        MODULE: ledger-service
    environment:
      # Where this service sends its spans. The collector decides what is kept;
      # this one exports all of them.
      MIZAN_OTLP: http://otel-collector:4318/v1/traces
      # Readable by default, because the usual reader of these is a person watching a
      # terminal. Set to ecs for the JSON a log store can query, which is what CI runs
      # with and what a deployment sets.
      MIZAN_LOG_FORMAT: ${MIZAN_LOG_FORMAT:-}
      MIZAN_DB_URL: jdbc:postgresql://postgres:5432/ledger
      MIZAN_DB_USERNAME: ${POSTGRES_USER:-mizan}
      MIZAN_DB_PASSWORD: ${POSTGRES_PASSWORD:-mizan}
      # What an internal call has to carry to move money between the platform's books and a
      # merchant's. A default for a stack on a laptop; a real deployment supplies its own,
      # and the service refuses to start if nothing does.
      MIZAN_INTERNAL_SERVICE_TOKEN: ${MIZAN_INTERNAL_SERVICE_TOKEN:-a-shared-secret-for-local-runs}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    # Longer than the 20s each service gives its in-flight work (HowThisPlatformStops). Compose's
    # default is 10s, which would kill a service still finishing a request on a plain docker stop.
    stop_grace_period: 30s
    healthcheck:
      # No curl in a distroless image, so the JVM already in it asks instead. The flags keep a
      # probe that runs every ten seconds from costing more than the work it is checking.
      test: ["CMD", "java", "-XX:TieredStopAtLevel=1", "-XX:+UseSerialGC", "-Xmx16m",
             "-cp", "/healthcheck", "Healthcheck", "http://localhost:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  payment-service:
    build:
      context: .
      args:
        MODULE: payment-service
    environment:
      # Where this service sends its spans. The collector decides what is kept;
      # this one exports all of them.
      MIZAN_OTLP: http://otel-collector:4318/v1/traces
      # Readable by default, because the usual reader of these is a person watching a
      # terminal. Set to ecs for the JSON a log store can query, which is what CI runs
      # with and what a deployment sets.
      MIZAN_LOG_FORMAT: ${MIZAN_LOG_FORMAT:-}
      MIZAN_DB_URL: jdbc:postgresql://postgres:5432/payment
      MIZAN_ACQUIRER_URL: http://bank-simulator:8086
      # The books, reached directly rather than through the edge. This is not a merchant's
      # request being forwarded; it is the platform recording what it did.
      MIZAN_LEDGER_URL: http://ledger-service:8082
      # The scorer, asked before every authorization. Deliberately not a depends_on: risk
      # being down must not stop this service starting, for the same reason it must not stop
      # it taking payments.
      MIZAN_RISK_URL: http://risk-service:8084
      # Where events go once they are written. The relay is what drains the outbox; until
      # this points somewhere, events are recorded and nobody is told.
      MIZAN_KAFKA: kafka:9092
      MIZAN_INTERNAL_SERVICE_TOKEN: ${MIZAN_INTERNAL_SERVICE_TOKEN:-a-shared-secret-for-local-runs}
      MIZAN_DB_USERNAME: ${POSTGRES_USER:-mizan}
      MIZAN_DB_PASSWORD: ${POSTGRES_PASSWORD:-mizan}
    depends_on:
      postgres:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    # Longer than the 20s each service gives its in-flight work (HowThisPlatformStops). Compose's
    # default is 10s, which would kill a service still finishing a request on a plain docker stop.
    stop_grace_period: 30s
    healthcheck:
      # No curl in a distroless image, so the JVM already in it asks instead. The flags keep a
      # probe that runs every ten seconds from costing more than the work it is checking.
      test: ["CMD", "java", "-XX:TieredStopAtLevel=1", "-XX:+UseSerialGC", "-Xmx16m",
             "-cp", "/healthcheck", "Healthcheck", "http://localhost:8083/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  risk-service:
    build:
      context: .
      args:
        MODULE: risk-service
    environment:
      # Where this service sends its spans. The collector decides what is kept;
      # this one exports all of them.
      MIZAN_OTLP: http://otel-collector:4318/v1/traces
      # Readable by default, because the usual reader of these is a person watching a
      # terminal. Set to ecs for the JSON a log store can query, which is what CI runs
      # with and what a deployment sets.
      MIZAN_LOG_FORMAT: ${MIZAN_LOG_FORMAT:-}
      MIZAN_DB_URL: jdbc:postgresql://postgres:5432/risk
      # Baselines are learned from payment events. Risk never reads the payment database.
      MIZAN_KAFKA: kafka:9092
      MIZAN_DB_USERNAME: ${POSTGRES_USER:-mizan}
      MIZAN_DB_PASSWORD: ${POSTGRES_PASSWORD:-mizan}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"
    # Longer than the 20s each service gives its in-flight work (HowThisPlatformStops). Compose's
    # default is 10s, which would kill a service still finishing a request on a plain docker stop.
    stop_grace_period: 30s
    healthcheck:
      # No curl in a distroless image, so the JVM already in it asks instead. The flags keep a
      # probe that runs every ten seconds from costing more than the work it is checking.
      test: ["CMD", "java", "-XX:TieredStopAtLevel=1", "-XX:+UseSerialGC", "-Xmx16m",
             "-cp", "/healthcheck", "Healthcheck", "http://localhost:8084/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  notification-service:
    build:
      context: .
      args:
        MODULE: notification-service
    environment:
      # Where this service sends its spans. The collector decides what is kept;
      # this one exports all of them.
      MIZAN_OTLP: http://otel-collector:4318/v1/traces
      # Readable by default, because the usual reader of these is a person watching a
      # terminal. Set to ecs for the JSON a log store can query, which is what CI runs
      # with and what a deployment sets.
      MIZAN_LOG_FORMAT: ${MIZAN_LOG_FORMAT:-}
      MIZAN_DB_URL: jdbc:postgresql://postgres:5432/notification
      # The first service on this platform that listens rather than answers.
      MIZAN_KAFKA: kafka:9092
      # Base64 of "mizan-webhook-signing-local-key!". Deliberately not the key that opens API
      # key secrets: a compromise of one should not be a compromise of the other. A deployment
      # sets this from wherever it keeps secrets.
      MIZAN_WEBHOOK_ENCRYPTION_KEY: bWl6YW4td2ViaG9vay1zaWduaW5nLWxvY2FsLWtleSE=
      # Off, and it stays off. Turning it on lets a merchant register an endpoint inside this
      # network, which makes the platform a way to issue requests on a stranger's behalf. It
      # exists so that a demonstration on a laptop can point a webhook at a server running on
      # that laptop, and for nothing else.
      MIZAN_WEBHOOK_ALLOW_ANY: ${MIZAN_WEBHOOK_ALLOW_ANY:-false}
      MIZAN_DB_USERNAME: ${POSTGRES_USER:-mizan}
      MIZAN_DB_PASSWORD: ${POSTGRES_PASSWORD:-mizan}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8085:8085"
    # Longer than the 20s each service gives its in-flight work (HowThisPlatformStops). Compose's
    # default is 10s, which would kill a service still finishing a request on a plain docker stop.
    stop_grace_period: 30s
    healthcheck:
      # No curl in a distroless image, so the JVM already in it asks instead. The flags keep a
      # probe that runs every ten seconds from costing more than the work it is checking.
      test: ["CMD", "java", "-XX:TieredStopAtLevel=1", "-XX:+UseSerialGC", "-Xmx16m",
             "-cp", "/healthcheck", "Healthcheck", "http://localhost:8085/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  settlement-service:
    build:
      context: .
      args:
        MODULE: settlement-service
    environment:
      # Where this service sends its spans. The collector decides what is kept;
      # this one exports all of them.
      MIZAN_OTLP: http://otel-collector:4318/v1/traces
      # Readable by default, because the usual reader of these is a person watching a
      # terminal. Set to ecs for the JSON a log store can query, which is what CI runs
      # with and what a deployment sets.
      MIZAN_LOG_FORMAT: ${MIZAN_LOG_FORMAT:-}
      MIZAN_DB_URL: jdbc:postgresql://postgres:5432/settlement
      MIZAN_KAFKA: kafka:9092
      MIZAN_LEDGER_URL: http://ledger-service:8082
      MIZAN_ACQUIRER_URL: http://bank-simulator:8086
      MIZAN_INTERNAL_SERVICE_TOKEN: ${MIZAN_INTERNAL_SERVICE_TOKEN:-a-shared-secret-for-local-runs}
      MIZAN_DB_USERNAME: ${POSTGRES_USER:-mizan}
      MIZAN_DB_PASSWORD: ${POSTGRES_PASSWORD:-mizan}
      # Left at the default hour on purpose, even locally. Shortening it so that a demo
      # could see a day close was tried and was worse: the sweep would close today while
      # captures were still arriving, and the ones that came afterwards waited for the next
      # day — which is correct behaviour and a confusing demo. Closing a day on purpose is
      # what the operator endpoint is for, and it ignores this setting.
      MIZAN_SETTLEMENT_CLOSE_AFTER: ${MIZAN_SETTLEMENT_CLOSE_AFTER:-1h}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # The ledger, because a fee that cannot be recorded is revenue nobody can reconcile.
      ledger-service:
        condition: service_healthy
    ports:
      - "8087:8087"
    # Longer than the 20s each service gives its in-flight work (HowThisPlatformStops). Compose's
    # default is 10s, which would kill a service still finishing a request on a plain docker stop.
    stop_grace_period: 30s
    healthcheck:
      # No curl in a distroless image, so the JVM already in it asks instead. The flags keep a
      # probe that runs every ten seconds from costing more than the work it is checking.
      test: ["CMD", "java", "-XX:TieredStopAtLevel=1", "-XX:+UseSerialGC", "-Xmx16m",
             "-cp", "/healthcheck", "Healthcheck", "http://localhost:8087/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  console:
    build:
      context: .
      dockerfile: console/Dockerfile
    # Same origin as the API, by proxying to the gateway. Not a convenience: the refresh
    # token is a cookie the page cannot read, and a browser only returns a cookie to the
    # origin that set it.
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      # By address rather than by name: nginx listens on IPv4 here and "localhost" resolves
      # to ::1 first inside this image, which is a health check that fails while the server
      # is perfectly well.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  bank-simulator:
    build:
      context: .
      args:
        MODULE: bank-simulator
    environment:
      # Where this service sends its spans. The collector decides what is kept;
      # this one exports all of them.
      MIZAN_OTLP: http://otel-collector:4318/v1/traces
      # Readable by default, because the usual reader of these is a person watching a
      # terminal. Set to ecs for the JSON a log store can query, which is what CI runs
      # with and what a deployment sets.
      MIZAN_LOG_FORMAT: ${MIZAN_LOG_FORMAT:-}
    ports:
      - "8086:8086"
    # Longer than the 20s each service gives its in-flight work (HowThisPlatformStops). Compose's
    # default is 10s, which would kill a service still finishing a request on a plain docker stop.
    stop_grace_period: 30s
    healthcheck:
      # No curl in a distroless image, so the JVM already in it asks instead. The flags keep a
      # probe that runs every ten seconds from costing more than the work it is checking.
      test: ["CMD", "java", "-XX:TieredStopAtLevel=1", "-XX:+UseSerialGC", "-Xmx16m",
             "-cp", "/healthcheck", "Healthcheck", "http://localhost:8086/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  prometheus:
    # What collects what every service already measures. Its configuration is a file in this
    # repository rather than something set up in a running instance, for the same reason the
    # migrations are: a monitoring setup that only exists in a container is one nobody can
    # review and nobody can bring back.
    image: ${PROMETHEUS_IMAGE}
    volumes:
      - ./deploy/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/local/alerts.yml:/etc/prometheus/alerts.yml:ro
      # The rules' own tests, beside them, so promtool in this container can run them.
      - ./deploy/local/alerts-test.yml:/etc/prometheus/alerts-test.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"
    # Deliberately depending on nothing. A service that is down is a thing Prometheus is
    # there to show, and a monitoring stack that waits for the platform to be healthy is one
    # that is never up when it is needed.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  otel-collector:
    # Every span every service makes arrives here, and most of them stop here. Keeping the
    # decision in one process is what makes "an error is always kept" possible at all: a
    # service samples at the first span of a trace, before the failure exists.
    image: ${OTEL_COLLECTOR_IMAGE}
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./deploy/local/otel-collector.yml:/etc/otel/config.yml:ro
    environment:
      # How much of what did not fail and was not slow is kept. Everything here; a few
      # percent anywhere that matters.
      MIZAN_TRACE_KEEP_PERCENT: ${MIZAN_TRACE_KEEP_PERCENT:-100}
    ports:
      # The services export to 4318 over HTTP. Published so that a service run outside the
      # stack from an IDE lands in the same traces as the rest of the platform.
      - "4318:4318"
    depends_on:
      - tempo
    healthcheck:
      # The collector answers on its own extension port only if one is configured; this asks
      # the receiver instead, which is the thing that has to be working.
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  tempo:
    # Where a trace is kept and where Grafana reads it from. Reached by the collector, never
    # by a service: the sampling decision is made once, and not here.
    image: ${TEMPO_IMAGE}
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./deploy/local/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempodata:/var/tempo
    ports:
      # Published so the smoke check can ask for the trace it just made. Grafana reaches it
      # over the network by name and does not need this.
      - "3200:3200"
    healthcheck:
      # By name rather than by address, and the opposite way round from the console's: this
      # image listens on IPv6 and 127.0.0.1 is answered by something that says 503 while Tempo
      # itself is perfectly well. Its own busybox wget, because there is no shell tooling here.
      test: ["CMD", "/busybox/wget", "-q", "-O", "/dev/null", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  grafana:
    # Where the numbers become something a person reads. Provisioned entirely from files in
    # this repository: the datasource, the dashboard provider, and the dashboards themselves.
    # Nothing is clicked to make this work, and nothing survives in the container that is not
    # also in the repository — a dashboard somebody built once in a running Grafana is a
    # dashboard nobody can review and nobody can bring back.
    image: ${GRAFANA_IMAGE}
    volumes:
      - ./deploy/local/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/local/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    environment:
      # A local stack, opened by a person who has already reached the machine it runs on.
      # A sign-in page here would protect nothing and would be one more thing to get past
      # while something is on fire. Anywhere that matters, this is not how it is run.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Opening Grafana should answer a question, not present a menu.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/is-the-platform-up.json
      # Nothing here should reach the internet to work.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "3000:3000"
    # Depending on Prometheus for ordering only, not for health: a monitoring stack that waits
    # for the thing it monitors is one that is never up when it is needed.
    depends_on:
      - prometheus
      - tempo
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  pgdata:
  kafkadata:
  redisdata:
  prometheusdata:
  grafanadata:
  tempodata:
