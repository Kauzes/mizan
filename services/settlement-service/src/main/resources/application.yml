server:
  port: 8087

spring:
  application:
    name: settlement-service
  datasource:
    url: ${MIZAN_DB_URL:jdbc:postgresql://localhost:5432/settlement}
    username: ${MIZAN_DB_USERNAME:mizan}
    password: ${MIZAN_DB_PASSWORD:mizan}
  jpa:
    hibernate:
      # Migrations own the schema. Anything Hibernate would generate is drift, and drift
      # should fail the service on startup rather than quietly reshape a live database.
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${MIZAN_KAFKA:localhost:29092}
    consumer:
      group-id: ${MIZAN_KAFKA_GROUP:settlement-service}
      # Earliest, because a service that only settles what happened since it last restarted
      # would silently drop a day of captures across a deploy.
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record
      # Continues the trace the event was recorded in rather than starting one of its own.
      # The producer side is the outbox, which writes the trace into the row and the relay
      # puts on the message as a standard traceparent header; this is the half that reads it.
      # Without it every consumer's work is an orphan trace that nothing connects to the
      # payment that caused it.
      observation-enabled: true
  flyway:
    locations: classpath:db/migration/settlement

mizan:
  acquirer:
    # The bank, for its daily statement. Read rather than written to: this service never asks
    # the acquirer to move money, which is the payment service's business.
    base-url: ${MIZAN_ACQUIRER_URL:http://localhost:8086}
    timeout: ${MIZAN_ACQUIRER_TIMEOUT:10s}
  ledger:
    base-url: ${MIZAN_LEDGER_URL:http://localhost:8082}
    timeout: ${MIZAN_LEDGER_TIMEOUT:5s}
  internal:
    # The credential the ledger's internal routes need. No merchant has it, because an entry
    # that names the platform's own accounts is not a merchant's to write.
    service-token: ${MIZAN_INTERNAL_SERVICE_TOKEN:}
  events:
    retries: ${MIZAN_EVENT_RETRIES:3}
    first-retry: ${MIZAN_EVENT_FIRST_RETRY:500ms}
    longest-retry: ${MIZAN_EVENT_LONGEST_RETRY:10s}
  settlement:
    # Which day a capture belongs to. One zone for the whole platform on purpose: a merchant
    # and an acquirer that disagree about when Tuesday started cannot reconcile Tuesday, and
    # the acquirer's day is the one that is not negotiable.
    zone: ${MIZAN_SETTLEMENT_ZONE:Europe/Istanbul}
    # What this platform charges for taking a payment: a share of the amount and a fixed part
    # per payment. Both configuration rather than constants, because the right numbers differ
    # between a demo and a deployment, and because the rule as applied is stored on every
    # batch so changing it never moves a settlement somebody has already been shown.
    fee-basis-points: ${MIZAN_SETTLEMENT_FEE_BPS:290}
    fee-fixed-per-payment: ${MIZAN_SETTLEMENT_FEE_FIXED:30}
    # How long after a day ends before it is closed. Late enough that a capture at the very
    # end of the day has been heard about, since events arrive asynchronously and a batch
    # that closed too early would leave payments to be settled in a day they did not happen.
    close-after: ${MIZAN_SETTLEMENT_CLOSE_AFTER:1h}
    close-every: ${MIZAN_SETTLEMENT_CLOSE_EVERY:15m}
    # Statements are per currency, as a real acquirer's are. One here for now, because the
    # simulator settles in one; a second acquirer or a second currency makes this a list.
    reconcile-currency: ${MIZAN_SETTLEMENT_CURRENCY:TRY}

springdoc:
  writer-with-order-by-keys: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, settlements, payouts, reconciliation, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Ready means able to do the work, which for this service means reaching its
        # database. The default readiness group says only that the application context
        # started, and a service that started perfectly and cannot reach Postgres is not a
        # service anything should be routed to.
        readiness:
          include: readinessState, db
  metrics:
    tags:
      service: ${spring.application.name}
  tracing:
    sampling:
      # Everything, from the service. The decision about what to keep is made once, by the
      # collector, where it can be made after a trace is finished and therefore after it is
      # known whether anything in it failed. Head sampling cannot do that: it decides at the
      # first span, before the error exists. A tracing setup that drops the failures only
      # records the days when nothing happened.
      probability: ${MIZAN_TRACE_SAMPLE:1.0}
  otlp:
    metrics:
      export:
        # Off. The starter that brings tracing also brings a metrics registry that pushes to
        # a collector, and this platform is scraped rather than pushing: two copies of every
        # number, arriving by different routes, is how a dashboard comes to disagree with
        # itself. Left on it also fills every log with 404s from an endpoint that does not
        # take metrics, which is how it was noticed.
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          # Boot 4's current name for it. The older management.otlp.tracing.endpoint still
          # works and is deprecated, which is the sort of thing that is silently fine until
          # the release that removes it.
          endpoint: ${MIZAN_OTLP:http://localhost:4318/v1/traces}

