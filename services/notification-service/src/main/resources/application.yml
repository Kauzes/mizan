server:
  port: 8085

spring:
  application:
    name: notification-service
  datasource:
    url: ${MIZAN_DB_URL:jdbc:postgresql://localhost:5432/notification}
    username: ${MIZAN_DB_USERNAME:mizan}
    password: ${MIZAN_DB_PASSWORD:mizan}
  jpa:
    hibernate:
      # Migrations own the schema. Anything Hibernate would generate is drift, and drift
      # should fail the service on startup rather than quietly reshape a live database.
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${MIZAN_KAFKA:localhost:29092}
    consumer:
      # The group is the service, so every instance of it shares the work and none of them
      # sees the same event twice in the ordinary case. A second consumer wanting the same
      # events uses a group of its own and gets its own copy.
      group-id: ${MIZAN_KAFKA_GROUP:notification-service}
      # Earliest, not latest. A consumer joining a topic that already has events on it should
      # see them: the alternative is that whatever happened before this service first started
      # is silently invisible to it forever.
      auto-offset-reset: earliest
      # Offsets are committed by the container after a message is handled, not on a timer
      # while it is still being handled. A timer would mean a crash mid-handling losing the
      # event, which is the one thing an at-least-once consumer must not do.
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # This service produces two things and neither is a domain event: a message it could not
      # handle, sent to the dead letter topic, and one an operator has asked to try again.
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record
  flyway:
    # Namespaced by service rather than the plain db/migration every service used to share.
    # One classpath is enough to make that ambiguous: a test that runs two services in one
    # JVM finds two V1s and Flyway refuses, which is how MIZ-45 found this. The files and
    # their checksums are unchanged, so an existing schema history still matches.
    locations: classpath:db/migration/notification

mizan:
  webhooks:
    # The key that opens merchant webhook signing secrets. Deliberately not the key that opens
    # API key secrets: a compromise of one should not be a compromise of the other. Blank
    # generates one per process, which is only ever right on a laptop and says so in the log.
    encryption-key: ${MIZAN_WEBHOOK_ENCRYPTION_KEY:}
    # How often deliveries that are due are looked for.
    deliver-every: ${MIZAN_WEBHOOK_DELIVER_EVERY:2s}
    # How many are claimed per pass, and how long any one call may take. The timeout is what
    # bounds how long a merchant whose server hangs can occupy a worker, and is therefore what
    # makes "a slow endpoint delays nobody else" true rather than hoped for.
    batch-size: ${MIZAN_WEBHOOK_BATCH_SIZE:32}
    timeout: ${MIZAN_WEBHOOK_TIMEOUT:10s}
    # Attempts before a delivery is given up on. Eight, with the backoff below, spans about
    # five hours -- long enough for an endpoint that is down for an hour to receive everything.
    attempts: ${MIZAN_WEBHOOK_ATTEMPTS:8}
    # For tests and for a demonstration on a laptop. See WebhookDestinations.
    allow-any-destination: ${MIZAN_WEBHOOK_ALLOW_ANY:false}
  events:
    # How many times a message is retried in the listener before it is set aside. Bounded,
    # because the partition waits during these: retrying forever is how one unhandleable event
    # stops every well formed one behind it.
    retries: ${MIZAN_EVENT_RETRIES:3}
    first-retry: ${MIZAN_EVENT_FIRST_RETRY:500ms}
    longest-retry: ${MIZAN_EVENT_LONGEST_RETRY:10s}

springdoc:
  # Keys in a stable order, so a regenerated spec differs only where the API differs and the
  # committed file stays reviewable.
  writer-with-order-by-keys: true

management:
  endpoints:
    web:
      exposure:
        # deadletters is how an operator finds out what could not be handled and sends one
        # back once the bug is fixed. Reachable only through the gateway's internal route,
        # which needs a token.
        include: health, info, deadletters, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Ready means able to do the work, which for this service means reaching its
        # database. The default readiness group says only that the application context
        # started, and a service that started perfectly and cannot reach Postgres is not a
        # service anything should be routed to.
        readiness:
          include: readinessState, db
  metrics:
    tags:
      service: ${spring.application.name}

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
