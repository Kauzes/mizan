server:
  port: 8082

spring:
  application:
    name: ledger-service
  datasource:
    url: ${MIZAN_DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${MIZAN_DB_USERNAME:mizan}
    password: ${MIZAN_DB_PASSWORD:mizan}
  jpa:
    hibernate:
      # Migrations own the schema. Anything Hibernate would generate is drift, and drift
      # should fail the service on startup rather than quietly reshape a live database.
      ddl-auto: validate
    open-in-view: false
  flyway:
    # Namespaced by service rather than the plain db/migration every service used to share.
    # One classpath is enough to make that ambiguous: a test that runs two services in one
    # JVM finds two V1s and Flyway refuses, which is how MIZ-45 found this. The files and
    # their checksums are unchanged, so an existing schema history still matches.
    locations: classpath:db/migration/ledger

mizan:
  internal:
    # The credential an internal call has to carry. Those endpoints move money between the
    # platform's books and a merchant's, which is the one thing no merchant endpoint may do,
    # so the service refuses to start without one rather than running with them open.
    service-token: ${MIZAN_INTERNAL_SERVICE_TOKEN:}

springdoc:
  # Keys in a stable order, so a regenerated spec differs only where the API differs and the
  # committed file stays reviewable.
  writer-with-order-by-keys: true

management:
  endpoints:
    web:
      exposure:
        # ledgerintegrity asks the books to prove they have not drifted. Reachable through
        # the gateway's internal route, which needs a token, and not on its public list.
        include: health, info, ledgerintegrity
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
