server:
  port: 8084

spring:
  application:
    name: risk-service
  datasource:
    url: ${MIZAN_DB_URL:jdbc:postgresql://localhost:5432/risk}
    username: ${MIZAN_DB_USERNAME:mizan}
    password: ${MIZAN_DB_PASSWORD:mizan}
  jpa:
    hibernate:
      # Migrations own the schema. Anything Hibernate would generate is drift, and drift
      # should fail the service on startup rather than quietly reshape a live database.
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${MIZAN_KAFKA:localhost:29092}
    consumer:
      group-id: ${MIZAN_KAFKA_GROUP:risk-service}
      # Earliest, because a scorer that only knows what happened since it last restarted is a
      # scorer whose baselines reset every deploy.
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # This service produces one thing and it is not a domain event: a message it could not
      # learn from, set aside for a person.
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record
      # Continues the trace the event was recorded in rather than starting one of its own.
      # The producer side is the outbox, which writes the trace into the row and the relay
      # puts on the message as a standard traceparent header; this is the half that reads it.
      # Without it every consumer's work is an orphan trace that nothing connects to the
      # payment that caused it.
      observation-enabled: true
  flyway:
    # Namespaced by service rather than the plain db/migration every service used to share.
    # One classpath is enough to make that ambiguous: a test that runs two services in one
    # JVM finds two V1s and Flyway refuses, which is how MIZ-45 found this. The files and
    # their checksums are unchanged, so an existing schema history still matches.
    locations: classpath:db/migration/risk

mizan:
  events:
    # Bounded, because retrying an unreadable event forever is a busy loop, and Spring's
    # default of nine immediate retries then moving on silently is the other wrong answer.
    retries: ${MIZAN_EVENT_RETRIES:3}
    first-retry: ${MIZAN_EVENT_FIRST_RETRY:500ms}
    longest-retry: ${MIZAN_EVENT_LONGEST_RETRY:10s}
  risk:
    # Where the platform's line sits for a merchant who has not chosen their own. A starting
    # point rather than an answer: a marketplace and a car dealer have different ideas of
    # alarming, and MIZ-59's feedback loop moves these per merchant from what analysts rule.
    review-above: ${MIZAN_RISK_REVIEW_ABOVE:40}
    block-above: ${MIZAN_RISK_BLOCK_ABOVE:70}

springdoc:
  # Keys in a stable order, so a regenerated spec differs only where the API differs and the
  # committed file stays reviewable.
  writer-with-order-by-keys: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Ready means able to do the work, which for this service means reaching its
        # database. The default readiness group says only that the application context
        # started, and a service that started perfectly and cannot reach Postgres is not a
        # service anything should be routed to.
        readiness:
          include: readinessState, db
  metrics:
    tags:
      service: ${spring.application.name}
  tracing:
    sampling:
      # Everything, from the service. The decision about what to keep is made once, by the
      # collector, where it can be made after a trace is finished and therefore after it is
      # known whether anything in it failed. Head sampling cannot do that: it decides at the
      # first span, before the error exists. A tracing setup that drops the failures only
      # records the days when nothing happened.
      probability: ${MIZAN_TRACE_SAMPLE:1.0}
  otlp:
    metrics:
      export:
        # Off. The starter that brings tracing also brings a metrics registry that pushes to
        # a collector, and this platform is scraped rather than pushing: two copies of every
        # number, arriving by different routes, is how a dashboard comes to disagree with
        # itself. Left on it also fills every log with 404s from an endpoint that does not
        # take metrics, which is how it was noticed.
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          # Boot 4's current name for it. The older management.otlp.tracing.endpoint still
          # works and is deprecated, which is the sort of thing that is silently fine until
          # the release that removes it.
          endpoint: ${MIZAN_OTLP:http://localhost:4318/v1/traces}

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
