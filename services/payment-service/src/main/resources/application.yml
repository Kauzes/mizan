server:
  port: 8083

spring:
  application:
    name: payment-service
  datasource:
    url: ${MIZAN_DB_URL:jdbc:postgresql://localhost:5432/payment}
    username: ${MIZAN_DB_USERNAME:mizan}
    password: ${MIZAN_DB_PASSWORD:mizan}
  jpa:
    hibernate:
      # Migrations own the schema. Anything Hibernate would generate is drift, and drift
      # should fail the service on startup rather than quietly reshape a live database.
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

mizan:
  acquirer:
    # The acquirer stands outside the platform, so this is the one place a service reaches
    # for somebody else's system. Compose points it at the simulator.
    base-url: ${MIZAN_ACQUIRER_URL:http://localhost:8086}
    # How long to wait before the answer counts as not having arrived. Short enough that a
    # merchant is not left holding a request, long enough that an ordinary answer arrives.
    timeout: ${MIZAN_ACQUIRER_TIMEOUT:5s}

springdoc:
  # Keys in a stable order, so a regenerated spec differs only where the API differs and the
  # committed file stays reviewable.
  writer-with-order-by-keys: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
