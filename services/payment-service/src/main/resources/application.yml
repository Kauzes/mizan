server:
  port: 8083

spring:
  application:
    name: payment-service
  datasource:
    url: ${MIZAN_DB_URL:jdbc:postgresql://localhost:5432/payment}
    username: ${MIZAN_DB_USERNAME:mizan}
    password: ${MIZAN_DB_PASSWORD:mizan}
  jpa:
    hibernate:
      # Migrations own the schema. Anything Hibernate would generate is drift, and drift
      # should fail the service on startup rather than quietly reshape a live database.
      ddl-auto: validate
    open-in-view: false
  flyway:
    # Namespaced by service rather than the plain db/migration every service used to share.
    # One classpath is enough to make that ambiguous: a test that runs two services in one
    # JVM finds two V1s and Flyway refuses, which is how MIZ-45 found this. The files and
    # their checksums are unchanged, so an existing schema history still matches.
    locations: classpath:db/migration/payment

mizan:
  acquirer:
    # The acquirer stands outside the platform, so this is the one place a service reaches
    # for somebody else's system. Compose points it at the simulator.
    base-url: ${MIZAN_ACQUIRER_URL:http://localhost:8086}
    # How long to wait before the answer counts as not having arrived. Short enough that a
    # merchant is not left holding a request, long enough that an ordinary answer arrives.
    timeout: ${MIZAN_ACQUIRER_TIMEOUT:5s}
  ledger:
    # The books live in another service, reached directly rather than through the edge: this
    # is not a merchant's request being forwarded, it is the platform recording what it did.
    base-url: ${MIZAN_LEDGER_URL:http://localhost:8082}
    timeout: ${MIZAN_LEDGER_TIMEOUT:5s}
  internal:
    # What proves to the ledger that this is a service and not a merchant. There is no
    # default: a blank one would make the internal endpoints open, and this service refuses
    # to start without it rather than discovering it at the first capture.
    service-token: ${MIZAN_INTERNAL_SERVICE_TOKEN:}

springdoc:
  # Keys in a stable order, so a regenerated spec differs only where the API differs and the
  # committed file stays reviewable.
  writer-with-order-by-keys: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
