server:
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: ${MIZAN_DB_URL:jdbc:postgresql://localhost:5432/identity}
    username: ${MIZAN_DB_USERNAME:mizan}
    password: ${MIZAN_DB_PASSWORD:mizan}
  jpa:
    hibernate:
      # Migrations own the schema. Anything Hibernate would generate is drift, and drift
      # should fail the service on startup rather than quietly reshape a live database.
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

mizan:
  security:
    jwt:
      # Who the token says issued it. A verifier checks this, so it changes with the
      # deployment rather than staying whatever was convenient locally.
      issuer: ${MIZAN_JWT_ISSUER:https://mizan.local/identity}
      # Minutes, because nothing can withdraw an access token before it expires: this is the
      # window in which a role change has not taken effect yet.
      access-token-ttl: ${MIZAN_ACCESS_TOKEN_TTL:15m}
      # Days, because this is how long a client can stay signed in without a password. It is
      # revocable, which is what makes the longer life acceptable.
      refresh-token-ttl: ${MIZAN_REFRESH_TOKEN_TTL:30d}
      # A PKCS#8 PEM private key, and never one committed here. Empty means the service
      # generates a key for its own process and says so loudly: tokens do not survive a
      # restart and no second instance can verify them, which is exactly what a local
      # default should feel like.
      private-key: ${MIZAN_JWT_PRIVATE_KEY:}
    api-keys:
      # Opens the stored API key secrets. HMAC is symmetric, so the side checking a
      # signature has to hold the secret that made it; what keeps a copy of the database
      # from being a set of working credentials is that this key is not in it. Empty means
      # one is generated for the process, and keys issued then stop verifying on restart.
      encryption-key: ${MIZAN_API_KEY_ENCRYPTION_KEY:}
      # How far a request's timestamp may be from ours. Small enough that a captured
      # request is not worth keeping, wide enough to survive an unsynchronised clock.
      clock-skew: ${MIZAN_API_KEY_CLOCK_SKEW:5m}

springdoc:
  # Keys in a stable order, so a regenerated spec differs only where the API differs and the
  # committed file stays reviewable.
  writer-with-order-by-keys: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
