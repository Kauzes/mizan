server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # A public path names a resource, not the service that happens to serve it:
            # a merchant integrating against Mizan should not have to know identity-service
            # exists, and moving a resource later should not change its URL. The remaining
            # routes below are still named after their service, and get the same treatment
            # as each one grows real endpoints.
            # Resources under a merchant are owned by different services, so the more
            # specific route is declared first and given an order that says so out loud
            # rather than relying on the order these happen to be read in. A merchant's
            # books live in the ledger; the merchant itself lives in identity.
            - id: ledger-service
              uri: http://ledger-service:8082
              order: -100
              predicates:
                - Path=/api/v1/merchants/*/accounts,/api/v1/merchants/*/accounts/**,/api/v1/merchants/*/entries,/api/v1/merchants/*/entries/**
            - id: identity-service
              uri: http://identity-service:8081
              order: 0
              predicates:
                - Path=/api/v1/merchants,/api/v1/merchants/**,/api/v1/tokens,/api/v1/tokens/**,/api/v1/roles
            - id: payment-service
              uri: http://payment-service:8083
              order: -100
              predicates:
                - Path=/api/v1/merchants/*/payments,/api/v1/merchants/*/payments/**,/api/v1/merchants/*/reviews,/api/v1/merchants/*/reviews/**,/api/v1/merchants/*/summary
            # There is deliberately no route to risk-service. Everything it serves is
            # asked for by another service on a merchant's behalf: scoring is asked for by
            # payment-service during an authorization, and what analysts have ruled is read
            # through the review queue, which is where the payment is. A route from the edge
            # would have been a way for one merchant to score against another merchant's
            # baseline and to read another merchant's rulings, because none of those paths
            # names a merchant the gateway could scope by.
            - id: settlement-service
              uri: http://settlement-service:8087
              order: -100
              predicates:
                - Path=/api/v1/merchants/*/settlements,/api/v1/merchants/*/settlements/**
            - id: notification-service
              uri: http://notification-service:8085
              order: -100
              predicates:
                - Path=/api/v1/merchants/*/notifications,/api/v1/merchants/*/notifications/**,/api/v1/merchants/*/webhook-endpoints,/api/v1/merchants/*/webhook-endpoints/**,/api/v1/merchants/*/webhook-deliveries,/api/v1/merchants/*/webhook-deliveries/**,/api/v1/notifications/**
            # These exist for two things: a published API contract and a health probe. They
            # used to be /internal/<service>/**, which meant every internal endpoint any
            # service would ever add was reachable from the edge by anyone holding a token.
            # MIZ-45 added the first internal endpoint that can move money, and a blanket
            # route would have exposed it the day it was written. A list of what is forwarded
            # fails closed: the next internal endpoint is unreachable until somebody decides
            # it should not be.
            - id: identity-service-internal
              uri: http://identity-service:8081
              predicates:
                - Path=/internal/identity-service/v3/api-docs,/internal/identity-service/v3/api-docs/**,/internal/identity-service/actuator/health,/internal/identity-service/actuator/health/**
              filters:
                - StripPrefix=2
            - id: ledger-service-internal
              uri: http://ledger-service:8082
              predicates:
                - Path=/internal/ledger-service/v3/api-docs,/internal/ledger-service/v3/api-docs/**,/internal/ledger-service/actuator/health,/internal/ledger-service/actuator/health/**
              filters:
                - StripPrefix=2
            - id: payment-service-internal
              uri: http://payment-service:8083
              predicates:
                - Path=/internal/payment-service/v3/api-docs,/internal/payment-service/v3/api-docs/**,/internal/payment-service/actuator/health,/internal/payment-service/actuator/health/**
              filters:
                - StripPrefix=2
            - id: risk-service-internal
              uri: http://risk-service:8084
              predicates:
                - Path=/internal/risk-service/v3/api-docs,/internal/risk-service/v3/api-docs/**,/internal/risk-service/actuator/health,/internal/risk-service/actuator/health/**
              filters:
                - StripPrefix=2
            - id: settlement-service-internal
              uri: http://settlement-service:8087
              predicates:
                - Path=/internal/settlement-service/v3/api-docs,/internal/settlement-service/v3/api-docs/**,/internal/settlement-service/actuator/health,/internal/settlement-service/actuator/health/**
              filters:
                - StripPrefix=2
            - id: notification-service-internal
              uri: http://notification-service:8085
              predicates:
                - Path=/internal/notification-service/v3/api-docs,/internal/notification-service/v3/api-docs/**,/internal/notification-service/actuator/health,/internal/notification-service/actuator/health/**
              filters:
                - StripPrefix=2
            # The gateway's own health, forwarded to the management port it now lives on.
            # Whether the platform is up is not a secret and the thing asking is usually a
            # load balancer holding no credentials, so this one endpoint stays answerable
            # from outside while the rest of the actuator does not. Everything else on that
            # port — the metrics, the route table — is reachable only from inside the network.
            - id: platform-health
              uri: http://127.0.0.1:${MIZAN_MANAGEMENT_PORT:8090}
              order: -100
              predicates:
                - Path=/actuator/health,/actuator/health/**

mizan:
  security:
    jwt:
      # The only issuer this gateway accepts.
      issuer: ${MIZAN_JWT_ISSUER:https://mizan.local/identity}
      # Fetched, not configured as a secret: the gateway verifies tokens and holds nothing
      # that could sign one. Compose points this at the service; the default is for a
      # gateway run straight off a laptop.
      jwk-set-uri: ${MIZAN_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
    api-keys:
      # Signed requests are verified by identity rather than here: the gateway holds no
      # signing secret, and a revoked key stops working at once rather than when a cache
      # would have expired.
      verification-uri: ${MIZAN_API_KEY_VERIFICATION_URI:http://localhost:8081/internal/api-keys/verify}
      # A signed request has to be read whole to hash it, so there is a limit on how much
      # the edge will hold.
      maximum-signed-body: ${MIZAN_MAX_SIGNED_BODY:1048576}

springdoc:
  # The gateway is where the platform's specs are browsed, through the same internal routes
  # the smoke check uses. Its own spec stays enabled because disabling it would take Swagger
  # UI with it, and it is empty anyway: the gateway routes and documents nothing of its own.
  # bank-simulator is missing on purpose. It stands in for a system outside the platform and
  # is not routed here.
  swagger-ui:
    urls:
      - name: identity-service
        url: /internal/identity-service/v3/api-docs
      - name: ledger-service
        url: /internal/ledger-service/v3/api-docs
      - name: payment-service
        url: /internal/payment-service/v3/api-docs
      - name: risk-service
        url: /internal/risk-service/v3/api-docs
      - name: settlement-service
        url: /internal/settlement-service/v3/api-docs
      - name: notification-service
        url: /internal/notification-service/v3/api-docs

management:
  # The gateway's own actuator lives on a port of its own, and that port is not published
  # outside the Compose network. Everywhere else on this platform the actuator is already out
  # of reach because the service is not routed from the edge — the gateway is the one service
  # that is the edge, so its numbers would otherwise be readable by anybody who can reach the
  # API. They are not a secret worth much, and they are not nothing: request rates, upstream
  # latencies and JVM internals are a description of what this platform is doing.
  #
  # Health is the exception and stays answerable from outside, through a route below. Whether
  # the platform is up is not a secret, and the thing asking is usually a load balancer that
  # holds no credentials.
  server:
    port: ${MIZAN_MANAGEMENT_PORT:8090}
  endpoints:
    web:
      exposure:
        include: health, info, gateway, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Deliberately only the application state. Redis is the one thing out here the
        # gateway needs, and a rate limiter that cannot be reached must not make the whole
        # platform unroutable — that would turn a degraded feature into an outage. What Redis
        # being down does is handled where the limit is applied.
        readiness:
          include: readinessState
  metrics:
    tags:
      service: ${spring.application.name}

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
