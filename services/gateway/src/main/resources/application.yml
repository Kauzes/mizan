server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # A public path names a resource, not the service that happens to serve it:
            # a merchant integrating against Mizan should not have to know identity-service
            # exists, and moving a resource later should not change its URL. The remaining
            # routes below are still named after their service, and get the same treatment
            # as each one grows real endpoints.
            # Resources under a merchant are owned by different services, so the more
            # specific route is declared first and given an order that says so out loud
            # rather than relying on the order these happen to be read in. A merchant's
            # books live in the ledger; the merchant itself lives in identity.
            - id: ledger-service
              uri: http://ledger-service:8082
              order: -100
              predicates:
                - Path=/api/v1/merchants/*/accounts,/api/v1/merchants/*/accounts/**,/api/v1/merchants/*/entries,/api/v1/merchants/*/entries/**
            - id: identity-service
              uri: http://identity-service:8081
              order: 0
              predicates:
                - Path=/api/v1/merchants,/api/v1/merchants/**,/api/v1/tokens,/api/v1/tokens/**
            - id: payment-service
              uri: http://payment-service:8083
              predicates:
                - Path=/api/v1/payments/**
            - id: risk-service
              uri: http://risk-service:8084
              predicates:
                - Path=/api/v1/risk/**
            - id: notification-service
              uri: http://notification-service:8085
              predicates:
                - Path=/api/v1/notifications/**
            - id: identity-service-internal
              uri: http://identity-service:8081
              predicates:
                - Path=/internal/identity-service/**
              filters:
                - StripPrefix=2
            - id: ledger-service-internal
              uri: http://ledger-service:8082
              predicates:
                - Path=/internal/ledger-service/**
              filters:
                - StripPrefix=2
            - id: payment-service-internal
              uri: http://payment-service:8083
              predicates:
                - Path=/internal/payment-service/**
              filters:
                - StripPrefix=2
            - id: risk-service-internal
              uri: http://risk-service:8084
              predicates:
                - Path=/internal/risk-service/**
              filters:
                - StripPrefix=2
            - id: notification-service-internal
              uri: http://notification-service:8085
              predicates:
                - Path=/internal/notification-service/**
              filters:
                - StripPrefix=2

mizan:
  security:
    jwt:
      # The only issuer this gateway accepts.
      issuer: ${MIZAN_JWT_ISSUER:https://mizan.local/identity}
      # Fetched, not configured as a secret: the gateway verifies tokens and holds nothing
      # that could sign one. Compose points this at the service; the default is for a
      # gateway run straight off a laptop.
      jwk-set-uri: ${MIZAN_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
    api-keys:
      # Signed requests are verified by identity rather than here: the gateway holds no
      # signing secret, and a revoked key stops working at once rather than when a cache
      # would have expired.
      verification-uri: ${MIZAN_API_KEY_VERIFICATION_URI:http://localhost:8081/internal/api-keys/verify}
      # A signed request has to be read whole to hash it, so there is a limit on how much
      # the edge will hold.
      maximum-signed-body: ${MIZAN_MAX_SIGNED_BODY:1048576}

springdoc:
  # The gateway is where the platform's specs are browsed, through the same internal routes
  # the smoke check uses. Its own spec stays enabled because disabling it would take Swagger
  # UI with it, and it is empty anyway: the gateway routes and documents nothing of its own.
  # bank-simulator is missing on purpose. It stands in for a system outside the platform and
  # is not routed here.
  swagger-ui:
    urls:
      - name: identity-service
        url: /internal/identity-service/v3/api-docs
      - name: ledger-service
        url: /internal/ledger-service/v3/api-docs
      - name: payment-service
        url: /internal/payment-service/v3/api-docs
      - name: risk-service
        url: /internal/risk-service/v3/api-docs
      - name: notification-service
        url: /internal/notification-service/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
