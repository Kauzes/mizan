server {
    listen 80;
    server_name _;

    # Everything the platform answers, forwarded to the gateway from this same origin. The
    # console never addresses a service, and never addresses the gateway by its own name:
    # a cookie set on this origin has to come back to this origin.
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        # One page, whatever the path. The router runs in the browser, so a reload on a deep
        # link has to be answered with the application rather than with a 404.
        try_files $uri $uri/ /index.html;
    }

    # An asset is named after its own contents, so it can be cached forever. index.html
    # cannot: it is what points at the current names, and a cached one is a console that
    # never updates.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
