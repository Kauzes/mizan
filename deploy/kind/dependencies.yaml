# What the chart points at and does not own, for a throwaway kind cluster only.
#
# Deliberately not part of the chart (ADR 0048): a real deployment uses a managed Postgres and a real
# Kafka. These are the smallest things that behave like them, so the rollout test exercises the
# platform rather than a database operator. Nothing here persists; the cluster is disposable.
#
# enableServiceLinks is off on every pod. Kubernetes injects variables named after each Service —
# a Service called kafka produces KAFKA_PORT=tcp://10.x.x.x:9092 — and the Kafka image turns every
# KAFKA_* variable into broker configuration, which stops it starting.
#
# Needs, created by scripts/rollout-under-load.sh before this is applied:
#   Secret mizan-credentials (databasePassword and the rest), shared with the chart
#   ConfigMap postgres-init (deploy/local/init-databases.sql), the same six databases as Compose
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports: [{ name: postgres, port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          # The same image Compose runs (.env).
          image: postgres:18-alpine
          env:
            - { name: POSTGRES_USER, value: mizan }
            - { name: POSTGRES_DB, value: mizan }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: mizan-credentials, key: databasePassword } }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "mizan", "-d", "mizan"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 256Mi }
          volumeMounts:
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: data, mountPath: /var/lib/postgresql }
      volumes:
        - name: init
          configMap: { name: postgres-init }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector: { app: kafka }
  ports: [{ name: kafka, port: 9092, targetPort: 9092 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka
          # The same image and the same single-node KRaft settings Compose runs, with the broker
          # advertised under its Service name instead of the Compose one.
          image: apache/kafka:4.3.1
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
          ports: [{ containerPort: 9092 }]
          readinessProbe:
            exec:
              command: ["sh", "-c", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
            # The check starts a JVM of its own, which takes longer than Kubernetes' default of one
            # second. Without this the broker was up and serving within seconds and the probe
            # timed out on every attempt, so nothing that needs Kafka was ever started. Compose's
            # healthcheck allows five for the same command.
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests: { cpu: 200m, memory: 512Mi }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
data:
  config.yml: |
    # Receives what the services export and throws it away after counting it. The rollout test is
    # about requests, not traces; this is here so that exporting succeeds rather than retrying.
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      debug:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [debug]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector: { app: otel-collector }
  ports: [{ name: otlp-http, port: 4318, targetPort: 4318 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  replicas: 1
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      enableServiceLinks: false
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.142.0
          args: ["--config=/etc/otel/config.yml"]
          ports: [{ containerPort: 4318 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/otel, readOnly: true }
      volumes:
        - name: config
          configMap: { name: otel-collector }
