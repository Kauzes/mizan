# What an install of Mizan needs to be told.
#
# Everything a person MUST supply is marked REQUIRED, and the chart refuses to render without it,
# naming what is missing. Nothing secret has a default here, because a default credential is
# either obviously fake or quietly becomes the credential a deployment runs on.
#
#   helm install mizan deploy/helm/mizan \
#     --set image.tag=<commit sha> \
#     --set-file credentials.jwtPrivateKey=jwt.pem \
#     --set credentials.databasePassword=... (and the rest of credentials below)
#
# The Compose stack stays the fast local path. This chart does not replace it.

image:
  # Where CI publishes (MIZ-82). Images are named mizan-<service>.
  repository: ghcr.io/kauzes
  # REQUIRED. The commit the images were built from. There is deliberately no default and no
  # "latest": an install should say exactly which source it is running.
  tag: ""
  pullPolicy: IfNotPresent

# Things this chart connects to and does not install.
dependencies:
  postgres:
    host: postgres
    port: 5432
    username: mizan
    # What the chart may use of Postgres's own limit (max_connections, 100 by default). Every pod
    # opens its pool, so the sum of replicas times pool across the chart has to fit, counted at an
    # autoscaler's maximum. ChartTest fails if it does not. Raise both together, never one.
    maxConnections: 100
    # Kept back for migrations, monitoring and a person with psql during an incident.
    reservedConnections: 10
  kafka:
    bootstrapServers: kafka:9092
  # Where the gateway keeps each merchant's rate limit, shared by every gateway pod (ADR 0053).
  # Not required to route: with Redis unreachable the gateway lets requests through unlimited.
  redis:
    host: redis
    port: 6379
  # The collector that decides which traces are kept (ADR 0043).
  otlpEndpoint: http://otel-collector:4318/v1/traces

# ECS JSON, because something is going to query these (ADR 0044). Readable text is for a person
# watching a terminal, which is the Compose stack's job.
logFormat: ecs

# How much of a container's memory limit the JVM may use for its heap. The JVM's own default is 25,
# which under a 512Mi limit leaves a Spring service 128MiB. Seventy-five leaves the rest for metaspace,
# thread stacks and direct buffers, which is what a service with a few hundred threads needs.
jvm:
  maxRamPercentage: 75

# How a pod stops. The application gives in-flight work 20s (HowThisPlatformStops); the pod waits
# preStopSeconds first so it has left the Service, and the grace period has to cover both with room
# to spare or Kubernetes kills the process mid-answer. LifecycleWiringTest keeps them in order.
lifecycle:
  preStopSeconds: 5
  terminationGracePeriodSeconds: 30

# Credentials, delivered as one Kubernetes Secret. Either name a Secret that already exists with
# these keys, or supply every value. REQUIRED one way or the other.
credentials:
  existingSecret: ""
  # Postgres password for every service that owns a database.
  databasePassword: ""
  # Shared token for calls that move money between services (payment, settlement → ledger).
  internalServiceToken: ""
  # Base64 of 32 bytes. Encrypts merchant API key secrets at rest (identity-service).
  apiKeyEncryptionKey: ""
  # Base64 of 32 bytes. Encrypts webhook signing secrets at rest (notification-service).
  # Deliberately a different key from the one above: one compromise should not be both.
  webhookEncryptionKey: ""
  # PKCS#8 PEM. Signs access tokens (identity-service). Pass with --set-file.
  jwtPrivateKey: ""

# One entry per service. Anything under env is plain configuration and lands in that service's
# ConfigMap; nothing under env may be a credential, and ChartTest checks that.
services:
  gateway:
    replicas: 2
    port: 8080
    # The actuator lives here and no Service exposes it (ADR 0040).
    managementPort: 8090
    redis: true
    resources:
      requests: { cpu: 250m, memory: 384Mi }
      limits: { memory: 512Mi }
    env:
      MIZAN_JWK_SET_URI: http://identity-service:8081/.well-known/jwks.json
      MIZAN_API_KEY_VERIFICATION_URI: http://identity-service:8081/internal/api-keys/verify
      # ADR 0053. Per merchant, across every gateway pod. A merchant may send this many requests a
      # second, and briefly up to the burst after being quiet. Beyond that, 429 with Retry-After.
      MIZAN_RATE_LIMIT_PER_SECOND: "100"
      MIZAN_RATE_LIMIT_BURST: "200"
    credentials: []

  identity-service:
    replicas: 2
    port: 8081
    database: identity
    # Five, not Hikari's ten. See maxConnections above.
    databasePool: 5
    resources:
      requests: { cpu: 250m, memory: 384Mi }
      limits: { memory: 512Mi }
    env: {}
    credentials: [databasePassword, apiKeyEncryptionKey, jwtPrivateKey]

  ledger-service:
    replicas: 2
    port: 8082
    database: ledger
    # Five, not Hikari's ten. See maxConnections above.
    databasePool: 5
    resources:
      requests: { cpu: 250m, memory: 384Mi }
      limits: { memory: 512Mi }
    env: {}
    credentials: [databasePassword, internalServiceToken]

  payment-service:
    # The floor the autoscaler starts from. With autoscaling on, the Deployment itself carries no
    # replica count, so helm upgrade does not reset what the autoscaler chose.
    replicas: 2
    # ADR 0050. An authorization holds a database connection across the acquirer call, so a pod
    # saturates on connections well before CPU. CPU is what every cluster can measure; connections
    # in use is the signal that means load, and needs a metrics adapter to turn on.
    autoscaling:
      minReplicas: 2
      # Six pods at five connections is 30 of the budget. More pods needs more Postgres first.
      maxReplicas: 6
      cpuPercent: 60
      # Five minutes without load before a pod is removed: payment traffic arrives in bursts.
      scaleDownAfterSeconds: 300
      connectionsInUse:
        enabled: false
        # Four of a pool of five busy on average: scale before the fifth is taken and requests
        # start waiting for a connection rather than for the acquirer.
        averagePerPod: 4
    port: 8083
    database: payment
    # Five, not Hikari's ten. See maxConnections above.
    databasePool: 5
    kafka: true
    resources:
      requests: { cpu: 500m, memory: 512Mi }
      limits: { memory: 768Mi }
    env:
      MIZAN_ACQUIRER_URL: http://bank-simulator:8086
      # ADR 0052. Below databasePool, so a slow acquirer cannot take the connections a merchant
      # reading a payment needs. ChartTest holds the two together.
      MIZAN_ACQUIRER_MAX_CONCURRENT_CALLS: "3"
      MIZAN_LEDGER_URL: http://ledger-service:8082
      MIZAN_RISK_URL: http://risk-service:8084
    credentials: [databasePassword, internalServiceToken]

  risk-service:
    replicas: 2
    port: 8084
    database: risk
    # Five, not Hikari's ten. See maxConnections above.
    databasePool: 5
    kafka: true
    resources:
      requests: { cpu: 250m, memory: 384Mi }
      limits: { memory: 512Mi }
    env: {}
    credentials: [databasePassword]

  notification-service:
    replicas: 2
    port: 8085
    database: notification
    # Five, not Hikari's ten. See maxConnections above.
    databasePool: 5
    kafka: true
    resources:
      requests: { cpu: 250m, memory: 384Mi }
      limits: { memory: 512Mi }
    env: {}
    credentials: [databasePassword, webhookEncryptionKey]

  settlement-service:
    replicas: 2
    port: 8087
    database: settlement
    # Five, not Hikari's ten. See maxConnections above.
    databasePool: 5
    kafka: true
    resources:
      requests: { cpu: 250m, memory: 384Mi }
      limits: { memory: 512Mi }
    env:
      MIZAN_ACQUIRER_URL: http://bank-simulator:8086
      MIZAN_LEDGER_URL: http://ledger-service:8082
    credentials: [databasePassword, internalServiceToken]

  # The fake acquirer. A real deployment turns it off and points the payment and settlement
  # services at a real one.
  bank-simulator:
    enabled: true
    replicas: 1
    port: 8086
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 384Mi }
    env: {}
    credentials: []
