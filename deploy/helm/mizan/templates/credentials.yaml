{{- /*
Credentials, created by the chart only when no existing Secret was named.

Each value is required: an install missing one fails at render time naming the value, rather
than starting a service that crashes on its first request. Nothing here has a default.
*/ -}}
{{- if not .Values.credentials.existingSecret }}
{{- $c := .Values.credentials }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mizan.credentialsSecret" . }}
  labels:
    {{- include "mizan.labels" . | nindent 4 }}
type: Opaque
stringData:
  databasePassword: {{ required "credentials.databasePassword is required (or name credentials.existingSecret)" $c.databasePassword | quote }}
  internalServiceToken: {{ required "credentials.internalServiceToken is required (or name credentials.existingSecret)" $c.internalServiceToken | quote }}
  apiKeyEncryptionKey: {{ required "credentials.apiKeyEncryptionKey is required (or name credentials.existingSecret)" $c.apiKeyEncryptionKey | quote }}
  webhookEncryptionKey: {{ required "credentials.webhookEncryptionKey is required (or name credentials.existingSecret)" $c.webhookEncryptionKey | quote }}
  jwtPrivateKey: {{ required "credentials.jwtPrivateKey is required (or name credentials.existingSecret)" $c.jwtPrivateKey | quote }}
{{- end }}
