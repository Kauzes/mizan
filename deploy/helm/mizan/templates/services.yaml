{{- /*
Every service, rendered from one loop over values.services.

One template rather than eight near copies, for the reason MIZ-79 took eight logging blocks down
to one: the ninth service is otherwise the one somebody forgets to give a ConfigMap, or labels
differently from its Service selector.

Probes, the preStop pause and the grace period came with MIZ-84: starting, ready and alive are
three questions with three consequences, and a pod finishes its work before it stops.
*/ -}}
{{- $root := . }}
{{- $tag := required "image.tag is required: the commit sha CI published (there is no latest)" .Values.image.tag }}
{{- range $name, $svc := .Values.services }}
{{- /* Compared as text: default treats false as empty, so "default true false" is true and
     a service set to enabled: false was installed anyway. */ -}}
{{- if ne (toString $svc.enabled) "false" }}
{{- /* The gateway answers health on its management port (ADR 0040); everybody else on http. */ -}}
{{- $probePort := ternary "management" "http" (not (empty $svc.managementPort)) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "mizan.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
data:
  MIZAN_LOG_FORMAT: {{ $root.Values.logFormat | quote }}
  MIZAN_OTLP: {{ $root.Values.dependencies.otlpEndpoint | quote }}
  # A quarter of the container's memory is the JVM's default heap, which at a 512Mi limit is 128MiB
  # for a Spring service. Measured, not assumed: MIZ-86 ran the image under the chart's limits.
  JAVA_TOOL_OPTIONS: {{ printf "-XX:MaxRAMPercentage=%v" $root.Values.jvm.maxRamPercentage | quote }}
  {{- if $svc.database }}
  MIZAN_DB_URL: {{ printf "jdbc:postgresql://%s:%v/%s" $root.Values.dependencies.postgres.host $root.Values.dependencies.postgres.port $svc.database | quote }}
  MIZAN_DB_USERNAME: {{ $root.Values.dependencies.postgres.username | quote }}
  {{- if $svc.databasePool }}
  # Sized against the Postgres connection budget in values.yaml, not left at Hikari's ten.
  SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: {{ $svc.databasePool | quote }}
  # An idle pod keeps two open rather than its whole pool.
  SPRING_DATASOURCE_HIKARI_MINIMUMIDLE: "2"
  {{- end }}
  {{- end }}
  {{- if $svc.kafka }}
  MIZAN_KAFKA: {{ $root.Values.dependencies.kafka.bootstrapServers | quote }}
  {{- end }}
  {{- range $key, $value := $svc.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "mizan.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  {{- if not $svc.autoscaling }}
  replicas: {{ $svc.replicas }}
  {{- else }}
  # No replicas here: the autoscaler owns the count (autoscaling.yaml). With one, every helm upgrade
  # would reset it and a deploy under load would shrink the service it is deploying.
  {{- end }}
  selector:
    matchLabels:
      {{- include "mizan.selector" $name | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mizan.selector" $name | nindent 8 }}
      annotations:
        # A changed ConfigMap rolls the pods. Without this, new configuration waits for the
        # next unrelated restart and nobody can say which configuration a pod is running.
        # Everything the ConfigMap is built from, not only the service's own env: a new Kafka
        # address is a configuration change too.
        checksum/config: {{ list $svc.env $svc.database $svc.databasePool $svc.kafka $root.Values.dependencies $root.Values.logFormat $root.Values.jvm | toYaml | sha256sum }}
    spec:
      # Longer than the preStop pause plus the application's shutdown phase, or the kubelet kills
      # the process while it is still answering. LifecycleWiringTest keeps it so.
      terminationGracePeriodSeconds: {{ $root.Values.lifecycle.terminationGracePeriodSeconds }}
      # No variables named after every other Service in the namespace. Kubernetes injects them by
      # default; they are noise to these services and a hazard to any image that reads configuration
      # from its environment, which is how Kafka failed to start in the kind cluster (MIZ-86).
      enableServiceLinks: false
      securityContext:
        # The image already runs as nonroot (MIZ-81). Said again here so the cluster refuses a
        # swapped image that does not.
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ printf "%s/mizan-%s:%s" $root.Values.image.repository $name $tag | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
            {{- if $svc.managementPort }}
            - name: management
              containerPort: {{ $svc.managementPort }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ $name }}
          {{- if $svc.credentials }}
          env:
            {{- range $svc.credentials }}
            - name: {{ include "mizan.credentialEnv" . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "mizan.credentialsSecret" $root }}
                  key: {{ . }}
            {{- end }}
          {{- end }}
          # Three questions, three consequences (MIZ-84). Starting: not asked the other two until
          # it has started, so a slow migration is not mistaken for a hung process.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: {{ $probePort }} }
            # Every probe says how long it waits. Kubernetes' default is one second, and a JVM on a
            # node busy starting other JVMs takes longer than that to answer a health check. The
            # first rollout under load (MIZ-86) found it: slow-but-healthy pods failed their probes,
            # were killed, and the rollout took down the version it was replacing.
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 36
          # Ready: can it do the work now, database included? No: no traffic, nothing else.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: {{ $probePort }} }
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          # Alive: is the process itself stuck? No: restart. Never a dependency, or a database
          # outage restarts every pod of every service at once.
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: {{ $probePort }} }
            # A full minute without an answer before a restart. A false restart is a worse outcome
            # than a slow one: it throws away a warm JVM and a connection pool, under load, at the
            # moment the node is least able to start another.
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            preStop:
              # Leave the Service before stopping, so requests routed in the last moment do not
              # reach a server already closing. The kubelet's own sleep: the image has no shell.
              sleep:
                seconds: {{ $root.Values.lifecycle.preStopSeconds }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # The one writable place, because the JVM and Tomcat need a scratch directory and
            # the root filesystem is read only.
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "mizan.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  selector:
    {{- include "mizan.selector" $name | nindent 4 }}
  ports:
    # The service port only. A management port is never listed here, which is how the
    # gateway's actuator stays unreachable from outside the pod network (ADR 0040).
    - name: http
      port: {{ $svc.port }}
      targetPort: http
{{- end }}
{{- end }}
